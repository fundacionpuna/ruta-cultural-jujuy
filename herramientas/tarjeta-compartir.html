<!doctype html><html><head><meta charset="utf-8">
<!-- La imagen que muestran WhatsApp y las redes al compartir el enlace (marca/compartir.jpg, 1200×630). Para regenerarla: abrir este archivo en el navegador a 1200×630 y sacar captura. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #fff; font-family: 'Open Sans', sans-serif; position: relative; overflow: hidden; }
  .hilos { position: absolute; top: 0; left: 0; right: 0; height: 18px; display: flex; }
  .hilos div { flex: 1; }
  .logo { position: absolute; left: 96px; top: 120px; height: 230px; }
  h1 { position: absolute; left: 100px; top: 392px; font-family: 'Outfit'; font-weight: 600; font-size: 58px; color: #ff5b4d; letter-spacing: -.01em; }
  .regiones { position: absolute; left: 102px; top: 478px; display: flex; gap: 16px; }
  .regiones span { display: inline-flex; align-items: center; gap: 10px; font-family: 'Outfit'; font-weight: 600; font-size: 25px; color: #241b28;
                   border: 3px solid #f0d9df; border-radius: 999px; padding: 9px 22px 9px 16px; }
  .regiones i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
  .pie { position: absolute; left: 104px; bottom: 34px; font-size: 21px; color: #75687a; }
  .forma { position: absolute; }
  .ola { width: 250px; right: 80px; top: 92px; }
  .mano { width: 150px; right: 262px; bottom: -44px; transform: rotate(-14deg); }
  .hoja { width: 128px; right: 64px; bottom: 26px; }
  .flor { width: 110px; right: 268px; top: 236px; }
  .piedra { width: 118px; right: 54px; top: 222px; transform: rotate(10deg); }
</style></head><body>
<div class="hilos"><div style="background:#cae7f2"></div><div style="background:#ffbe00"></div><div style="background:#ffbbcc"></div><div style="background:#bcd047"></div></div>
<img class="logo" src="../marca/logo-vamo-pue-corto.svg">
<h1>Ruta cultural jujeña</h1>
<div class="regiones">
  <span><i style="background:#cae7f2;box-shadow:0 0 0 2px #1f6fa8"></i>Puna</span>
  <span><i style="background:#ffbe00;box-shadow:0 0 0 2px #8a6a00"></i>Quebrada</span>
  <span><i style="background:#ffbbcc;box-shadow:0 0 0 2px #d2306b"></i>Valles</span>
  <span><i style="background:#bcd047;box-shadow:0 0 0 2px #69761e"></i>Yungas</span>
</div>
<p class="pie">Un proyecto de Fundación Puna</p>
<img class="forma ola" src="../marca/forma-ola.svg">
<img class="forma flor" src="../marca/forma-flor.svg">
<img class="forma piedra" src="../marca/forma-piedra.svg">
<img class="forma hoja" src="../marca/forma-hoja.svg">
<img class="forma mano" src="../marca/forma-mano.svg">
</body></html>
