<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vamo pue · Ruta cultural jujeña — Fundación Puna</title>
<!-- El favicon es el pin del logo «vamo pue», en un PNG cuadrado aparte:
     el navegador estira cualquier imagen que no lo sea. -->
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   VAMO PUE — ruta cultural jujeña · Fundación Puna
   Identidad «vamo pue» (octubre 2026): coral, rosa, celeste y
   amarillo, formas orgánicas y colores planos.
   El logo usa RTL Nova, que no está disponible para la web: los
   títulos van en Outfit, la geométrica libre más parecida.
   El cuerpo va en Open Sans, igual que en la presentación.
   ══════════════════════════════════════════════════════════ */

:root {
  /* paleta «vamo pue» */
  --papel:    #ffffff;   /* fondo: blanco, para leer más fácil */
  --blanco:   #ffffff;
  --coral:    #ff5b4d;   /* Yungas, y el color principal de la marca */
  --rosa:     #ffbbcc;   /* Valles */
  --celeste:  #a6d9fa;   /* Puna */
  --amarillo: #fdfaaf;   /* Quebrada */
  --lima:     #bcd046;   /* el verde de las formas, para WhatsApp */
  --rosado:   #fff1f4;   /* acento claro: resaltado de la lista, notas */

  /* neutros. La tinta es el fondo oscuro de la presentación. */
  --tinta:  #241b28;
  --suave:  #75687a;   /* sobre blanco 5.2:1, sobre el rosado 4.8:1 */
  --borde:  #f0d9df;

  --curva: 999px;   /* todo redondeado: botones tipo píldora */
}
/* --c es el color de relleno de la región; --t, el mismo oscurecido
   para líneas y textos, porque los pasteles sobre blanco no se leen. */
.c-puna     { --c: var(--celeste);  --t: #1f6fa8; }
.c-quebrada { --c: var(--amarillo); --t: #8a6a00; }
.c-valles   { --c: var(--rosa);     --t: #d2306b; }
.c-yungas   { --c: var(--coral);    --t: #d63a2c; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: 'Open Sans', system-ui, sans-serif;
  font-size: 17px;
  background: var(--papel);
  color: var(--tinta);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* franja con los cuatro colores de región */
#hilos { height: 6px; display: flex; flex-shrink: 0; }
#hilos div { flex: 1; transition: opacity .25s; }

/* ── Barra de arriba: una sola línea, para que el mapa se
      lleve todo el resto de la pantalla ──────────────────── */
header {
  flex-shrink: 0;
  padding: 9px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--borde);
  position: relative;
  z-index: 1200;
  background: var(--papel);
}
.izq { display: flex; align-items: center; gap: 11px; min-width: 0; }
.der { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }

/* botón grande que abre el cajón de filtros */
#abrir-cajon {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--coral);
  color: var(--tinta);
  border: 2px solid var(--coral);
  border-radius: var(--curva);
  padding: 10px 20px;
  min-height: 46px;
  cursor: pointer;
  white-space: nowrap;
}
#abrir-cajon:hover { filter: brightness(1.05); }
#abrir-cajon svg { width: 19px; height: 19px; flex-shrink: 0; }

/* el cajón: baja por encima del mapa */
#cajon {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--papel);
  border-bottom: 1px solid var(--borde);
  box-shadow: 0 8px 20px rgba(36,27,40,.13);
  padding: 4px 0 16px;
  z-index: 1200;
  display: none;
}
#cajon.abierto { display: block; }
.cajon-aviso {
  font-size: 13.5px;
  color: var(--suave);
  text-align: center;
  max-width: 76ch;
  margin: 9px auto 0;
  padding: 0 18px;
  line-height: 1.5;
}
.cajon-aviso b { color: var(--tinta); }
#idiomas { display: flex; gap: 5px; }
.idioma {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .03em;
  min-width: 48px;
  min-height: 44px;   /* mismo mínimo que el resto, para el dedo */
  padding: 8px 13px;
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  background: var(--blanco);
  color: var(--suave);
  cursor: pointer;
}
.idioma:hover { border-color: var(--coral); color: var(--tinta); }
.idioma[aria-pressed="true"] {
  background: var(--tinta);
  border-color: var(--tinta);
  color: var(--blanco);
}

.marca {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
}
.marca img { height: 46px; width: auto; display: block; }
.marca .textos { border-left: 2px solid var(--borde); padding-left: 13px; }
.marca .textos { text-align: left; min-width: 0; }
h1 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 19px;
  font-weight: 600;
  color: var(--coral);
  line-height: 1.1;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.proyecto {
  font-size: 12.5px;
  color: var(--suave);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Pasos ───────────────────────────────────────────────── */
.paso {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--suave);
  margin: 13px 18px 7px;
  text-align: center;
}

/* ── Filas de píldoras ───────────────────────────────────── */
/* Luis: "Región todo en 1 línea horizontal y lo mismo que buscas,
   1 sola línea horizontal". Así que no envuelven nunca; si no entran,
   se arrastran de costado. `safe center` centra cuando entran y no
   recorta el primero cuando no. */
.fila-botones {
  display: flex;
  justify-content: safe center;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  flex-shrink: 0;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.fila-botones::-webkit-scrollbar { display: none; }
/* En pantalla angosta la fila no entra y se arrastra de costado. El
   degradado del borde avisa que hay más botones para ese lado. */
.fila-botones.mas-der {
  mask-image: linear-gradient(to right, #000 84%, transparent 100%);
}
.fila-botones.mas-izq {
  mask-image: linear-gradient(to left, #000 84%, transparent 100%);
}
.fila-botones.mas-izq.mas-der {
  mask-image: linear-gradient(to right, transparent 0, #000 16%,
                              #000 84%, transparent 100%);
}

/* base común de las dos filas */
.pildora {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--blanco);
  color: var(--suave);
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.pildora:hover { border-color: var(--coral); color: var(--tinta); }
/* elegida: coral de Puna. El texto va en tinta, no en blanco:
   blanco sobre coral da 3.1:1 y no llega al mínimo legible. */
.pildora[aria-pressed="true"] {
  background: var(--coral);
  border-color: var(--coral);
  color: var(--tinta);
}
.pildora[aria-pressed="true"]:hover { filter: brightness(1.04); }

/* fila 1 — regiones */
.region { font-size: 17px; padding: 10px 21px; min-height: 48px; }
.region .punto {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--c); flex-shrink: 0;
  box-shadow: 0 0 0 1.5px var(--t);
}
/* Sobre la píldora coral, el punto coral de Yungas desaparecería. Un
   aro blanco lo despega del fondo. */
.region[aria-pressed="true"] .punto { box-shadow: 0 0 0 2px var(--blanco); }
.region .pin-marca { width: 19px; height: 19px; flex-shrink: 0; }

/* fila 2 — qué busca. Más chica que la de regiones. */
.tipo { font-size: 15px; padding: 8px 16px; min-height: 44px; }
.tipo svg { width: 19px; height: 19px; flex-shrink: 0; }

/* ── Búsqueda ────────────────────────────────────────────── */
#barra-buscar {
  display: flex;
  justify-content: center;
  padding: 12px 24px 13px;
  flex-shrink: 0;
}
#buscar {
  font-family: 'Open Sans', sans-serif;
  font-size: 16px;
  padding: 11px 20px;
  min-height: 46px;
  width: 320px;
  max-width: 100%;
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  background: var(--blanco);
  color: var(--tinta);
}
#buscar::placeholder { color: #a8979f; }
#buscar:focus { border-color: var(--coral); outline: none; }

:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }

/* ── Cuerpo ──────────────────────────────────────────────── */
#cuerpo {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}
#lista {
  width: 380px;
  flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid var(--borde);
}
body.sin-lista #lista { display: none; }
#alternar-lista {
  position: absolute;
  bottom: 16px;
  left: 396px;          /* al costado de la lista */
  z-index: 900;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  background: var(--blanco);
  color: var(--tinta);
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  padding: 9px 16px;
  min-height: 42px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(36,27,40,.14);
}
#alternar-lista:hover { border-color: var(--coral); }
body.sin-lista #alternar-lista { left: 16px; }
#mapa { flex: 1; min-width: 0; }

.cuenta {
  padding: 15px 24px 10px;
  font-size: 15px;
  color: var(--suave);
}

/* ── Fila de la lista ────────────────────────────────────── */
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  font-family: 'Open Sans', sans-serif;
  background: none;
  border: none;
  border-top: 1px solid var(--borde);
  padding: 14px 24px;
  min-height: 72px;
  cursor: pointer;
}
.item:hover { background: var(--rosado); }
.pastilla {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: inset 0 0 0 1.5px var(--t);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.pastilla svg { width: 21px; height: 21px; }
.item .t { min-width: 0; display: block; }
.item .n {
  display: block;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.22;
  color: var(--tinta);
}
.item .d {
  display: block;
  font-size: 14.5px;
  color: var(--suave);
  margin-top: 2px;
}
.vacio {
  padding: 30px 24px;
  font-size: 17px;
  line-height: 1.6;
  color: var(--suave);
}

/* ── Ficha ───────────────────────────────────────────────── */
#volver {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 500;
  background: none;
  border: none;
  color: var(--suave);
  cursor: pointer;
  padding: 15px 24px;
  min-height: 50px;
}
#volver:hover { color: var(--tinta); }
/* Mientras no haya foto, va la ilustración de la región */
.f-foto {
  height: 170px;
  background: #f9f0ee center / contain no-repeat;
  border-top: 1px solid var(--borde);
  border-bottom: 1px solid var(--borde);
  display: flex;
  align-items: flex-end; justify-content: center;
  padding-bottom: 8px;
  color: var(--suave);
  font-size: 13px;
}
.foto-libre { margin:0; background:#f9f0ee; }
.foto-libre img { display:block; width:100%; height:210px; object-fit:contain; }
.foto-libre figcaption { padding:8px 16px; font-size:12px; line-height:1.5; }
.foto-libre a { color:inherit; }
.f-cuerpo { padding: 18px 24px 34px; }
.f-tipo {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  background: var(--c);
  color: var(--tinta);
  border-radius: var(--curva);
  padding: 6px 14px;
  font-size: 14px;
  margin-bottom: 12px;
}
.f-tipo svg { width: 17px; height: 17px; }
.f-nombre {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 5px;
}
.f-donde { font-size: 16px; color: var(--suave); margin-bottom: 15px; }
.f-texto { font-size: 17.5px; line-height: 1.68; margin-bottom: 20px; }
a.llegar {
  display: inline-block;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 17px;
  font-weight: 600;
  background: var(--tinta);
  color: var(--blanco);
  text-decoration: none;
  padding: 13px 26px;
  border-radius: var(--curva);
  min-height: 50px;
}
a.llegar:hover { background: #3b2d42; }
.f-muestra { font-size: 15px; color: var(--suave); margin-top: 14px; line-height: 1.5; }
.f-relevamiento { margin: 16px 0; padding: 14px; background: var(--rosado); border-radius: 16px; font-size: 14px; line-height: 1.6; }
.f-relevamiento p + p { margin-top: 8px; }
.f-relevamiento ul { padding-left: 20px; margin-top: 5px; }
.f-relevamiento a { color: var(--tinta); text-decoration: underline; overflow-wrap: anywhere; }
.relevado-etiqueta { display: block; margin-top: 4px; font-size: 12px; color: var(--suave); }
.pin.orientativo { border-style: dashed; }
.pin.grupo { font-weight: 700; font-size: 16px; color: var(--tinta); }  /* tinta: en blanco, sobre el coral no llega al contraste */
.grupo-propuestas { min-width: 220px; max-width: 280px; }
.grupo-propuestas p { font-size: 13px; line-height: 1.5; }
.grupo-propuestas button { display: block; width: 100%; min-height: 44px; margin-top: 6px; padding: 8px; border: 1px solid var(--borde); border-radius: 12px; background: white; color: var(--tinta); text-align: left; cursor: pointer; font: inherit; }

/* datos del sendero: largo, dificultad y tiempo */
.f-datos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
.dato {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  font-size: 15.5px;
  background: var(--rosado);
  border-radius: var(--curva);
  padding: 7px 15px;
}
.dato svg { width: 18px; height: 18px; }
/* la dificultad en puntos, como en los carteles de montaña: uno, dos o tres */
.nivel { display: inline-flex; gap: 4px; }
.nivel i {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--tinta);
}
.nivel i.on { background: var(--tinta); }
.f-duracion {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; color: var(--suave); margin-bottom: 15px;
}
.f-duracion svg { width: 18px; height: 18px; flex-shrink: 0; }

/* botones de la ficha: contacto, compartir, descargar */
.f-contacto, .f-acciones { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.f-contacto { margin-bottom: 12px; }
.boton {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 600;
  background: var(--blanco);
  color: var(--tinta);
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  padding: 11px 20px;
  min-height: 50px;
  text-decoration: none;
  cursor: pointer;
}
.boton:hover { border-color: var(--coral); }
.boton svg { width: 19px; height: 19px; flex-shrink: 0; }
/* WhatsApp va pintado: es lo primero que se busca. El verde lima de las
   formas, con el texto en tinta: 9.7:1. */
.boton.wa { background: var(--lima); border-color: var(--lima); }
.boton.wa:hover { filter: brightness(1.05); }
a.llegar { display: inline-flex; align-items: center; }
.f-nota {
  font-size: 15px; line-height: 1.5;
  background: var(--rosado);
  border-radius: 16px;
  padding: 11px 15px;
  margin-bottom: 12px;
}

/* bloques de abajo de la ficha: el guía o el sendero, y lo cercano */
.f-bloque { border-top: 1px solid var(--borde); padding-bottom: 6px; }
.f-sub {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--suave);
  padding: 16px 24px 6px;
}
.item.chico { min-height: 60px; padding: 9px 24px; border-top: none; }
.item.chico .pastilla { width: 36px; height: 36px; }
.item.chico .pastilla svg { width: 18px; height: 18px; }
.item.chico .n { font-size: 17px; }

/* al pie de la lista: para que un emprendimiento pida sumarse */
.sumate {
  border-top: 1px solid var(--borde);
  background: var(--rosado);
  padding: 20px 24px 26px;
  font-size: 16px;
  position: relative;
  overflow: hidden;
}
.sumate > * { position: relative; }
.sumate p { margin-bottom: 10px; max-width: 30ch; }
.sumate .boton { border-color: var(--coral); background: var(--blanco); }
.sumate .forma { position: absolute; pointer-events: none; }
.sumate .forma.flor { width: 92px; right: -16px; top: -18px; }
.sumate .forma.piedra { width: 70px; right: 52px; bottom: -34px; }
.sumate .de-puna {
  max-width: none;
  display: flex; align-items: center; gap: 9px;
  margin-top: 18px; font-size: 13px; color: var(--suave);
}
.sumate .de-puna img { height: 24px; width: auto; }

/* La cabecera de la lista: cuando se elige una región, su ilustración
   y su lema, como en la presentación de la marca. */
.portada {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px 4px;
}
.portada img {
  width: 76px; height: 54px; object-fit: cover;
  border-radius: 16px; flex-shrink: 0;
}
.portada .nombre {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 21px; font-weight: 700; color: var(--t); line-height: 1.15;
}
.portada .lema { font-size: 14.5px; color: var(--suave); }
.portada + .cuenta { padding-top: 8px; }

/* Formas orgánicas de la página de recursos, en las esquinas del cajón.
   Son adorno: no se tocan y en el teléfono no van. */
#cajon { overflow: hidden; }
#cajon > * { position: relative; }
#cajon .forma { position: absolute; pointer-events: none; z-index: 0; }
#cajon .forma.mano { width: 66px; left: 22px; bottom: -14px; transform: rotate(-12deg); }
#cajon .forma.ola  { width: 96px; right: 30px; top: 14px; }
#cajon .forma.hoja { width: 58px; right: 26px; bottom: -10px; }

/* ── Mapa ────────────────────────────────────────────────── */
.leaflet-container {
  background: #fbf3f4;
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
}
#mapa .leaflet-tile-pane { filter: saturate(.5) sepia(.13) brightness(1.04); }
.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 1px 4px rgba(36,27,40,.2) !important;
  border-radius: 22px !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  width: 40px !important; height: 40px !important;
  line-height: 38px !important; font-size: 23px !important;
  color: var(--tinta) !important;
  background: var(--blanco) !important;
  border-bottom-color: var(--borde) !important;
}
.leaflet-control-attribution { font-size: 10.5px !important; }
.leaflet-tooltip {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--tinta);
  border-radius: 12px;
  padding: 5px 11px;
}

.pin {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--c);
  border: 3px solid var(--blanco);
  /* un aro fino en el tono oscuro de la región: los pasteles solos se
     pierden sobre el relieve claro del mapa */
  box-shadow: 0 0 0 1.5px var(--t), 0 2px 5px rgba(36,27,40,.3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.pin svg { width: 18px; height: 18px; }
.pin.elegido {
  width: 46px; height: 46px;
  box-shadow: 0 0 0 2px var(--t), 0 0 0 6px rgba(255,91,77,.3), 0 3px 8px rgba(36,27,40,.35);
}
.pin.elegido svg { width: 24px; height: 24px; }

.rotulo {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--t);
  white-space: nowrap;
  transform: translate(-50%, -50%);
  text-shadow: 0 0 4px var(--papel), 0 0 8px var(--papel),
               0 0 12px var(--papel), 0 0 16px var(--papel);
}

/* ── Teléfono ────────────────────────────────────────────── */
@media (max-width: 900px) {
  html, body { height: auto; overflow: visible; }
  /* la barra se parte en dos filas: marca arriba, controles abajo */
  header { padding: 9px 13px; flex-wrap: wrap; gap: 9px; }
  .izq { width: 100%; }
  .der { width: 100%; justify-content: space-between; }
  .marca img { height: 40px; }
  h1 { font-size: 16px; }
  #cajon .forma { display: none; }
  .proyecto { font-size: 11.5px; }
  #abrir-cajon { font-size: 15px; padding: 9px 16px; }
  .paso { margin: 12px 13px 6px; }
  .fila-botones { padding: 0 13px; gap: 8px; }
  .cajon-aviso { font-size: 12.5px; padding: 0 13px; }
  .region { font-size: 15.5px; padding: 9px 16px; }
  .tipo { font-size: 14px; padding: 7px 13px; }
  #barra-buscar { padding: 11px 14px 12px; }
  #buscar { width: 100%; }

  #cuerpo { flex-direction: column; min-height: 0; }
  #mapa { order: 1; height: 62vh; flex: none; }   /* el mapa, grande */
  /* en el teléfono la lista va debajo del mapa, no le quita ancho:
     no hace falta el botón de esconderla */
  #alternar-lista { display: none; }
  #lista {
    order: 2; width: 100%; flex: none; overflow: visible;
    border-right: none; border-top: 1px solid var(--borde);
  }
  .cuenta, .item, #volver, .f-cuerpo, .f-sub, .item.chico, .sumate, .portada {
    padding-left: 14px; padding-right: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="hilos"></div>

<header>
  <div class="izq">
    <div class="marca">
      <img src="marca/logo-vamo-pue-corto.svg" alt="Vamo pue">
      <div class="textos">
        <h1 id="titulo">Ruta Cultural de Jujuy</h1>
        <p class="proyecto" id="proyecto">Un proyecto de Fundación Puna</p>
      </div>
    </div>
  </div>
  <div class="der">
    <div id="idiomas"></div>
    <button id="abrir-cajon" aria-expanded="false" aria-controls="cajon"></button>
  </div>

  <!-- El cajón: los filtros salen de la pantalla y bajan de acá, así el
       mapa se lleva todo el alto. -->
  <div id="cajon">
    <img class="forma mano" src="marca/forma-mano.svg" alt="">
    <img class="forma ola" src="marca/forma-ola.svg" alt="">
    <img class="forma hoja" src="marca/forma-hoja.svg" alt="">
    <p class="paso" id="paso1"></p>
    <div class="fila-botones" id="regiones"></div>

    <p class="paso" id="paso2"></p>
    <div class="fila-botones" id="tipos"></div>
    <div class="fila-botones" id="precios" style="margin-top:12px"></div>

    <div id="barra-buscar">
      <input id="buscar" type="search">
    </div>

    <p class="cajon-aviso" id="aviso"></p>
  </div>
</header>

<div id="cuerpo">
  <div id="lista" aria-live="polite"></div>
  <div id="mapa"></div>
  <button id="alternar-lista"></button>
</div>

<script src="datos.js"></script>
<script src="relevados.js"></script>
<script src="actividades.js"></script>
<script src="fotos.js"></script>
<script src="senderos.js"></script>
<script>
'use strict';

const REG = window.REGIONES;
const ORDEN = window.ORDEN_REGIONES;
const CAT = window.CATEGORIAS;
const LUGARES = window.LUGARES;
const IDIOMAS = window.IDIOMAS;
const TEXTOS = window.TEXTOS;
const TRAZADOS = window.TRAZADOS || {};
const FUNDACION = window.FUNDACION;

/* Idioma: el que eligió antes, o el del navegador si es uno de los
   tres, o castellano. */
function idiomaInicial() {
  const guardado = localStorage.getItem('rcj-idioma');
  if (guardado && IDIOMAS[guardado]) return guardado;
  const nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return IDIOMAS[nav] ? nav : 'es';
}
/* t() para los textos de interfaz; tr() para los campos {es,en,pt}
   de los datos, con el castellano como respaldo si falta alguno. */
const t = clave => TEXTOS[estado.idioma][clave];
const tr = campo => typeof campo === 'string'
  ? campo
  : (campo[estado.idioma] || campo.es);

/* TINTE es el relleno de cada región; TRAZO, el mismo color oscurecido
   para las líneas del mapa y los rótulos (los pasteles no se leen solos). */
const TINTE = {}, TRAZO = {};
ORDEN.forEach(k => { TINTE[k] = REG[k].color; TRAZO[k] = REG[k].trazo; });
const tinte = k => `--c:${TINTE[k]};--t:${TRAZO[k]}`;

const LIMITES = L.latLngBounds([[-24.75, -67.35], [-21.70, -63.85]]);

/* Una región y un tipo a la vez: siempre hay exactamente un botón
   encendido y es el que se está viendo. */
const estado = { idioma: 'es', zona: 'todas', tipo: 'todos', precio: 'todos', busqueda: '', elegido: null };
estado.idioma = idiomaInicial();

/* ── Dibujos ─────────────────────────────────────────────── */
const ICONOS = {
  bolsa:     '<path d="M5 7h14l1 14H4zM8 8V6a4 4 0 0 1 8 0v2"/>',
  cama:      '<path d="M3 18v-6h11a4 4 0 0 1 4 4v2M3 18h18M3 12V7M7.5 9.5h3"/>',
  cubiertos: '<path d="M8 3v7a2 2 0 0 1-4 0V3M6 12v9M16 3c1.8 0 2.8 2 2.8 4.6S17.6 12 17.6 12v9"/>',
  cerro:     '<path d="M2 19l6.5-10L13 16l2.5-3.5L22 19z"/>',
  brujula:   '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l2.2 4.5L12 16.5 9.8 12z"/>',
  bici: '<circle cx="5" cy="17" r="4"/><circle cx="19" cy="17" r="4"/><path d="M5 17l5-9 5 9H5M8 8h4M15 5h3l1 12"/>',
  bota:      '<path d="M7 3h6v7l5 2.3a2.5 2.5 0 0 1 1.5 2.3V18H6l1-7z"/><path d="M5 21h15M10 7h3"/>',
  reloj:     '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chat:      '<path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.4a8.5 8.5 0 1 1 15.6-4.6z"/>',
  telefono:  '<path d="M5 3.5h3.5l2 5-2.4 1.5a11 11 0 0 0 5.9 5.9l1.5-2.4 5 2V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
  camara:    '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17 7h.01"/>',
  globo:     '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/>',
  sobre:     '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  compartir: '<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 13.2l7.6 4.1M15.8 6.7l-7.6 4.1"/>',
  bajar:     '<path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M5 20h14"/>'
};
function svg(nombre, trazo) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${trazo}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            ${ICONOS[nombre]}</svg>`;
}
/* El pin dentro del círculo, la «o» del logo «vamo pue». Va en el
   botón de toda la provincia. */
function pinMarca(relleno, clase) {
  return `<svg class="${clase || ''}" viewBox="0 0 24 24" fill="${relleno}" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M12 0a12 12 0 1 0 0 24a12 12 0 1 0 0-24z
                 M12 20.5s-5.2-6.6-5.2-10.2a5.2 5.2 0 0 1 10.4 0c0 3.6-5.2 10.2-5.2 10.2z
                 M12 7.7a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z"/>
          </svg>`;
}

/* ── Mapa ────────────────────────────────────────────────── */
const map = L.map('mapa', {
  zoomControl: true, minZoom: 6, maxZoom: 16, zoomSnap: 0, zoomDelta: 0.6
}).fitBounds(LIMITES);

/* Mapa base: el topográfico de Esri, claro y con el relieve sombreado,
   que es lo que hace falta para leer los cerros y los senderos. Antes
   era CARTO, que en septiembre de 2026 empezó a pedir clave y dejó el
   mapa gris con un cartel de «API KEY REQUIRED» en cada cuadro.
   Si Esri deja de responder, se pasa solo a OpenStreetMap. */
const ESRI_TOPO = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
const OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const OSM_ATRIB = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

const base = L.tileLayer(ESRI_TOPO, {
  maxZoom: 16,
  attribution: 'Tiles &copy; Esri — Esri, HERE, Garmin, FAO, NOAA, USGS · ' + OSM_ATRIB
}).addTo(map);

let fallas = 0;
base.on('tileerror', () => {
  if (++fallas < 6) return;
  base.off('tileerror');
  map.removeLayer(base);
  L.tileLayer(OSM, { maxZoom: 16, attribution: OSM_ATRIB }).addTo(map).bringToBack();
});

const capaZonas    = L.layerGroup().addTo(map);
const capaSenderos = L.layerGroup().addTo(map);
const capaPins     = L.layerGroup().addTo(map);

/* Leaflet guarda el tamaño del contenedor y sólo lo recalcula con el
   resize de la ventana. Acá el mapa se encoge sin que la ventana se
   mueva (al cargar las tipografías la cabecera crece, y en el teléfono
   los botones se acomodan en más filas). */
let reajuste;
new ResizeObserver(() => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => map.invalidateSize({ animate: false }), 120);
}).observe(document.getElementById('mapa'));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => map.invalidateSize({ animate: false }));
}

const poligonos = {};
ORDEN.forEach(k => {
  poligonos[k] = L.polygon(REG[k].poligono, {
    color: TRAZO[k], weight: 2.5, opacity: .9,
    dashArray: '7 6', fill: false, interactive: false
  });
});

function rotulo(k) {
  const b = poligonos[k].getBounds(), c = b.getCenter();
  return L.marker([c.lat + (b.getNorth() - c.lat) * 0.62, c.lng], {
    interactive: false,
    icon: L.divIcon({ className: '', iconSize: [0, 0],
      html: `<div class="rotulo" style="${tinte(k)}">${REG[k].nombre}</div>` })
  });
}

/* El dibujo del pin va en tinta, no en blanco: sobre los pasteles de la
   marca el blanco casi no se ve. */
function pin(l, elegido) {
  return L.divIcon({
    className: '', iconSize: elegido ? [46, 46] : [34, 34],
    iconAnchor: elegido ? [23, 23] : [17, 17],
    html: `<div class="pin${elegido ? ' elegido' : ''}${l.relevamiento?.ubicacion === 'referencia' ? ' orientativo' : ''}" style="${tinte(l.region)}">
             ${svg(CAT[l.categoria].icono, '#241b28')}</div>`
  });
}

const marcadores = {};
LUGARES.forEach(l => {
  const m = L.marker([l.lat, l.lng], { title: l.nombre, alt: l.nombre, icon: pin(l, false) });
  m.on('click', () => irA(l.id));
  marcadores[l.id] = m;
});

/* El sendero se dibuja en el color de su región, lleno (el contorno de
   la región va punteado, así no se confunden) y con un borde blanco para
   que se despegue del relieve. Encima va una línea ancha invisible, que
   es la que se toca: el camino de 4 px es muy finito para el dedo. */
function dibujarSendero(l, elegido) {
  const tramos = TRAZADOS[l.id];
  const g = L.layerGroup();
  if (elegido) {
    L.polyline(tramos, { color: '#ff5b4d', weight: 16, opacity: .3,
      lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(g);
  }
  L.polyline(tramos, { color: '#ffffff', weight: elegido ? 9 : 7, opacity: .95,
    lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(g);
  L.polyline(tramos, { color: TRAZO[l.region], weight: elegido ? 5 : 4, opacity: 1,
    lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(g);
  L.polyline(tramos, { color: '#000', weight: 22, opacity: 0 })
    .bindTooltip(l.nombre, { sticky: true, direction: 'top', offset: [0, -8] })
    .on('click', () => irA(l.id))
    .addTo(g);
  return g;
}

/* Largo del sendero, medido sobre el trazado. */
function distanciaKm(a, b) {
  const r = Math.PI / 180;
  const h = Math.sin((b[0] - a[0]) * r / 2) ** 2 +
            Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function largoKm(id) {
  return (TRAZADOS[id] || []).reduce((s, tramo) =>
    s + tramo.slice(1).reduce((t, p, i) => t + distanciaKm(tramo[i], p), 0), 0);
}
const cifra = km => km.toLocaleString(estado.idioma,
  { maximumFractionDigits: km < 10 ? 1 : 0 });

/* ── Filtro ──────────────────────────────────────────────── */
function pasa(l) {
  if (estado.precio && estado.precio !== 'todos' && (l.precio?.estado || 'consultar') !== estado.precio) return false;
  if (estado.zona !== 'todas' && l.region !== estado.zona) return false;
  if (estado.tipo !== 'todos' && l.categoria !== estado.tipo) return false;
  if (estado.busqueda) {
    const h = `${l.nombre} ${l.localidad} ${tr(l.descripcion)}`.toLowerCase();
    if (!h.includes(estado.busqueda)) return false;
  }
  return true;
}
const porId = id => LUGARES.find(l => l.id === id);

/* La ficha abierta queda en la dirección (…/#qu-s1), así el enlace se
   puede mandar por WhatsApp y el botón de volver del teléfono la cierra. */
function soltarElegido() {
  estado.elegido = null;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

/* ── Paso 1: regiones, todas en una línea ────────────────── */
const elReg = document.getElementById('regiones');
[['todas'], ...ORDEN.map(k => [k])].forEach(([k]) => {
  const b = document.createElement('button');
  b.className = 'pildora region' + (k === 'todas' ? '' : ' c-' + k);
  b.dataset.region = k;
  b.innerHTML = (k === 'todas' ? pinMarca('currentColor', 'pin-marca')
                               : '<span class="punto"></span>') + '<span class="et"></span>';
  b.addEventListener('click', () => {
    estado.zona = k;
    if (estado.elegido && !pasa(porId(estado.elegido))) soltarElegido();
    pintar();
    encuadrar();
  });
  elReg.appendChild(b);
});

/* ── Paso 2: qué busca, en una línea y más chico ──────────── */
const elTipos = document.getElementById('tipos');
[['todos', null], ...Object.entries(CAT).map(([k, c]) => [k, c.icono])]
.forEach(([k, icono]) => {
  const b = document.createElement('button');
  b.className = 'pildora tipo';
  b.dataset.tipo = k;
  b.innerHTML = (icono ? svg(icono, 'currentColor') : '') + '<span class="et"></span>';
  b.addEventListener('click', () => {
    estado.tipo = k;
    if (estado.elegido && !pasa(porId(estado.elegido))) soltarElegido();
    pintar();
  });
  elTipos.appendChild(b);
});

const elPrecios = document.getElementById('precios');
['todos', 'gratis', 'costo', 'consultar'].forEach(k => {
  const b = document.createElement('button');
  b.className = 'pildora tipo'; b.dataset.precio = k;
  b.addEventListener('click', () => {
    estado.precio = k;
    if (estado.elegido && !pasa(porId(estado.elegido))) soltarElegido();
    pintar();
  });
  elPrecios.appendChild(b);
});

/* ── Aviso de que la fila sigue para el costado ───────────── */
function marcarBordes(fila) {
  const mas = fila.scrollWidth - fila.clientWidth;
  fila.classList.toggle('mas-izq', fila.scrollLeft > 2);
  fila.classList.toggle('mas-der', mas > 2 && fila.scrollLeft < mas - 2);
}
const filasBotones = [...document.querySelectorAll('.fila-botones')];
filasBotones.forEach(f => {
  f.addEventListener('scroll', () => marcarBordes(f), { passive: true });
  new ResizeObserver(() => marcarBordes(f)).observe(f);
});
const revisarBordes = () => filasBotones.forEach(marcarBordes);

/* ── El cajón de filtros ─────────────────────────────────── */
const elCajon = document.getElementById('cajon');
const btnCajon = document.getElementById('abrir-cajon');
const lupa = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true">
                 <circle cx="10.5" cy="10.5" r="7"/><line x1="15.8" y1="15.8" x2="21" y2="21"/></svg>`;

function cajonAbierto() { return elCajon.classList.contains('abierto'); }
function alternarCajon(abrir) {
  const v = abrir === undefined ? !cajonAbierto() : abrir;
  elCajon.classList.toggle('abierto', v);
  btnCajon.setAttribute('aria-expanded', String(v));
  btnCajon.innerHTML = lupa + `<span>${v ? t('cerrarCajon') : t('abrirCajon')}</span>`;
  setTimeout(() => { map.invalidateSize({ animate: false }); revisarBordes(); }, 60);
}
btnCajon.addEventListener('click', () => alternarCajon());
/* clic en el mapa o Escape lo cierran */
document.getElementById('cuerpo').addEventListener('pointerdown', () => {
  if (cajonAbierto()) alternarCajon(false);
}, true);

/* ── Mostrar u ocultar la lista, para que el mapa ocupe todo ── */
const btnLista = document.getElementById('alternar-lista');
function pintarBotonLista() {
  const oculta = document.body.classList.contains('sin-lista');
  btnLista.textContent = oculta ? t('verLista') : t('ocultarLista');
  btnLista.setAttribute('aria-pressed', String(!oculta));
}
btnLista.addEventListener('click', () => {
  document.body.classList.toggle('sin-lista');
  pintarBotonLista();
  setTimeout(() => map.invalidateSize({ animate: false }), 60);
});

/* ── Botones de idioma ───────────────────────────────────── */
const elIdiomas = document.getElementById('idiomas');
Object.entries(IDIOMAS).forEach(([codigo, i]) => {
  const b = document.createElement('button');
  b.className = 'idioma';
  b.dataset.idioma = codigo;
  b.textContent = i.etiqueta;
  b.lang = codigo;
  b.title = i.nombre;
  b.setAttribute('aria-label', i.nombre);
  b.addEventListener('click', () => {
    estado.idioma = codigo;
    localStorage.setItem('rcj-idioma', codigo);
    traducir();
    pintar();
  });
  elIdiomas.appendChild(b);
});

/* Cambia todo el texto fijo de la página al idioma elegido. Lo que
   sale de los datos (lista y ficha) lo rehace pintar(). */
function traducir() {
  document.documentElement.lang = estado.idioma;
  document.title = 'Vamo pue · ' + t('titulo') + ' — Fundación Puna';
  document.getElementById('titulo').textContent = t('titulo');
  document.getElementById('proyecto').textContent = t('proyecto');
  document.getElementById('aviso').innerHTML =
    `${t('aviso')} <b>${t('avisoFuerte')}</b> ${t('avisoResto')}`;
  document.getElementById('paso1').textContent = t('paso1');
  document.getElementById('paso2').textContent = t('paso2');

  const buscar = document.getElementById('buscar');
  buscar.placeholder = t('buscar');
  buscar.setAttribute('aria-label', t('buscarAria'));

  elReg.querySelector('[data-region="todas"] .et').textContent = t('todasRegiones');
  ORDEN.forEach(k =>
    elReg.querySelector(`[data-region="${k}"] .et`).textContent = REG[k].nombre);
  elTipos.querySelector('[data-tipo="todos"] .et').textContent = t('todo');
  Object.keys(CAT).forEach(k =>
    elTipos.querySelector(`[data-tipo="${k}"] .et`).textContent = tr(CAT[k].boton));

  elPrecios.querySelectorAll('[data-precio]').forEach(b => {
    b.textContent = t(b.dataset.precio === 'todos' ? 'precioTodos' : b.dataset.precio);
    b.setAttribute('aria-label', t('precio') + ': ' + b.textContent);
  });
  elIdiomas.querySelectorAll('[data-idioma]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.idioma === estado.idioma)));

  btnCajon.innerHTML = lupa +
    `<span>${cajonAbierto() ? t('cerrarCajon') : t('abrirCajon')}</span>`;
  pintarBotonLista();
}

function encuadrar() {
  if (estado.zona === 'todas') { map.flyToBounds(LIMITES, { duration: .6 }); return; }
  /* getBounds() devuelve el objeto interno del polígono: acá se lee
     y nada más, no se le hace extend() encima. */
  map.flyToBounds(poligonos[estado.zona].getBounds(), { padding: [26, 26], duration: .6 });
}

/* ── Franja de colores ───────────────────────────────────── */
const elHilos = document.getElementById('hilos');
ORDEN.forEach(k => {
  const d = document.createElement('div');
  d.dataset.region = k;
  d.style.background = TINTE[k];
  elHilos.appendChild(d);
});

/* ── Lista y ficha ───────────────────────────────────────── */
const elLista = document.getElementById('lista');

/* Abrir desde un botón pasa por la dirección, así queda un paso en el
   historial: el botón de volver del teléfono cierra la ficha en lugar
   de irse de la página. El cambio de dirección llama a abrir(). */
function irA(id) {
  if (location.hash === '#' + id) abrir(id);
  else location.hash = id;
}
function seguirDireccion() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (porId(id)) abrir(id);
  else if (estado.elegido) { estado.elegido = null; pintar(); }
}
window.addEventListener('hashchange', seguirDireccion);

function cerrarFicha() { soltarElegido(); pintar(); }

function abrir(id) {
  const l = porId(id);
  /* Si se llega desde «Cerca de acá» o desde un enlace, el lugar puede no
     entrar en los filtros de ahora: se aflojan lo justo para que aparezca. */
  if (!pasa(l) && estado.busqueda) { estado.busqueda = ''; elBuscar.value = ''; }
  if (!pasa(l)) estado.tipo = 'todos';
  if (!pasa(l)) estado.zona = 'todas';
  if (!pasa(l)) estado.precio = 'todos';
  estado.elegido = id;
  /* la ficha va en la lista: si estaba escondida, se muestra */
  if (document.body.classList.contains('sin-lista')) {
    document.body.classList.remove('sin-lista');
    pintarBotonLista();
    map.invalidateSize({ animate: false });
  }
  pintar();
  if (TRAZADOS[id]) {
    map.flyToBounds(L.latLngBounds(TRAZADOS[id].flat()),
      { padding: [40, 40], maxZoom: 15, duration: .6 });
  } else {
    map.panTo([l.lat, l.lng], { animate: true, duration: .5 });
  }
  elLista.scrollTop = 0;
  const v = document.getElementById('volver');
  if (v) v.focus({ preventScroll: true });
}

/* Una fila chica, para el guía, el sendero y lo cercano. */
function filaChica(l, detalle) {
  return `
    <button class="item chico" data-abre="${l.id}">
      <span class="pastilla" style="${tinte(l.region)}">${svg(CAT[l.categoria].icono, '#241b28')}</span>
      <span class="t">
        <span class="n">${l.nombre}</span>
        <span class="d">${tr(CAT[l.categoria].nombre)} · ${detalle}</span>
      </span>
    </button>`;
}

/* Lo más cercano, de cualquier tipo: un sendero lleva a dónde comer y
   dormir, y un hospedaje a los senderos y paseos de la zona. */
function cercanos(l, apartar) {
  // No calcular distancias a partir de un centro de localidad como si fuera
  // la posición exacta del emprendimiento.
  if (l.relevamiento?.ubicacion === 'referencia') return [];
  return LUGARES
    .filter(o => o.id !== l.id && !apartar.includes(o.id) && o.relevamiento?.ubicacion !== 'referencia')
    .map(o => ({ o, km: distanciaKm([l.lat, l.lng], [o.lat, o.lng]) }))
    .filter(x => x.km <= 30)
    .sort((a, b) => a.km - b.km)
    .slice(0, 4);
}

/* Botones de contacto. En un dato de muestra no llevan a ningún lado:
   avisan que es un ejemplo, para no mandar a nadie a un número inventado. */
function botonesContacto(l) {
  const c = l.contacto;
  if (!c) return '';
  const lista = [];
  if (c.whatsapp) lista.push(['wa', 'chat', t('whatsapp'),
    `https://wa.me/${c.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(t('mensajeWhatsapp')(l.nombre))}`]);
  if (c.telefono) lista.push(['', 'telefono', t('llamar'), `tel:${c.telefono.replace(/[^\d+]/g, '')}`]);
  if (c.instagram) lista.push(['', 'camara', t('instagram'), `https://www.instagram.com/${c.instagram.replace(/^@/, '')}`]);
  if (c.web) lista.push(['', 'globo', t('web'), c.web]);
  if (c.email) lista.push(['', 'sobre', t('correo'),
    `mailto:${c.email}?subject=${encodeURIComponent(t('asuntoCorreo')(l.nombre))}`]);

  const botones = lista.map(([clase, icono, texto, href]) => l.muestra
    ? `<button class="boton ${clase}" data-ejemplo>${svg(icono, 'currentColor')}${texto}</button>`
    : `<a class="boton ${clase}" href="${href}" target="_blank" rel="noopener">${svg(icono, 'currentColor')}${texto}</a>`
  ).join('');
  return `<div class="f-contacto" role="group" aria-label="${t('contacto')}">${botones}</div>
          <p class="f-nota" id="nota-ejemplo" hidden>${t('contactoEjemplo')}</p>`;
}

function datosSendero(l) {
  const d = l.distancia_publicada;
  const distancia = d ? `${cifra(d.km)} km · ${t(d.alcance)}`
    : TRAZADOS[l.id] ? t('largo')(cifra(largoKm(l.id))) : t('datoConsultar');
  return `<div class="f-datos">
    <span class="dato">${svg(l.categoria === 'bici' ? 'bici' : 'bota', '#241b28')}${distancia}</span>
    <span class="dato">${l.dificultad ? t('dificultad')[l.dificultad] : t('datoConsultar')}</span>
    </div>${l.duracion ? `<p class="f-duracion">${svg('reloj', 'currentColor')}${tr(l.duracion)}</p>` : ''}
    ${l.condiciones ? `<p class="f-nota">${escaparHtml(tr(l.condiciones))}</p>` : ''}
    ${!TRAZADOS[l.id] ? `<p class="f-nota">${t('sinTrack')}</p>` : ''}`;
}

async function compartir(l, boton) {
  const url = location.href.split('#')[0] + '#' + l.id;
  if (navigator.share) {
    try { await navigator.share({ title: `${l.nombre} — ${t('titulo')}`, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); } catch (e) { window.prompt('', url); return; }
  const antes = boton.innerHTML;
  boton.innerHTML = svg('compartir', 'currentColor') + t('copiado');
  setTimeout(() => { boton.innerHTML = antes; }, 2200);
}

/* El GPX se arma acá mismo con el trazado: no hay archivos que subir. */
function descargarGpx(l) {
  const esc = s => s.replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
  const tramos = TRAZADOS[l.id].map(tramo => '  <trkseg>\n' +
    tramo.map(([la, lo]) => `    <trkpt lat="${la}" lon="${lo}"/>`).join('\n') + '\n  </trkseg>').join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Ruta Cultural de Jujuy — Fundación Puna" xmlns="http://www.topografix.com/GPX/1/1">
 <metadata>
  <name>${esc(l.nombre)}</name>
  <copyright author="OpenStreetMap contributors"><license>https://opendatacommons.org/licenses/odbl/1-0/</license></copyright>
 </metadata>
 <trk>
  <name>${esc(l.nombre)}</name>
${tramos}
 </trk>
</gpx>
`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = l.nombre.normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.gpx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function escaparHtml(texto) {
  return String(texto).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function datosRelevamiento(l) {
  const r = l.relevamiento;
  if (!r) return '';
  return `<aside class="f-relevamiento" aria-label="${t('relevado')}">
    <strong>${t('relevado')}</strong>
    <p>${t('pendienteVerificacion')}</p>
    ${r.ubicacion === 'referencia' ? `<p>${t('ubicacionOrientativa')}</p>` : ''}
    ${l.direccion ? `<p><b>${t('direccionPublicada')}:</b> ${escaparHtml(l.direccion)}</p>` : ''}
    ${l.categoria === 'artesania' ? `<p>${t('consultaCompra')}</p>` : ''}
    <p>${t('fuente')} · ${t('fechaConsulta')}: ${new Date(r.fecha + 'T12:00:00').toLocaleDateString(estado.idioma)}</p>
    <ul>${r.fuentes.map(f => `<li><a href="${escaparHtml(f.url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.titulo)}</a></li>`).join('')}</ul>
  </aside>`;
}

function precioFicha(l) {
  const p = l.precio;
  return `<aside class="f-relevamiento"><strong>${t('precio')}: ${t(p?.estado || 'consultar')}</strong>
    ${p ? `<p>${escaparHtml(tr(p.nota))}</p><ul>${p.fuentes.map(f => `<li><a href="${escaparHtml(f.url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.titulo)}</a></li>`).join('')}</ul>` : ''}</aside>`;
}
function fotoFicha(l) {
  const f = l.foto;
  if (!f) return `<div class="f-foto" style="background-image:url('marca/region-${l.region}.jpg')"><span>${t('sinFoto')}</span></div>`;
  return `<figure class="foto-libre"><img data-foto src="${escaparHtml(f.url)}" alt="${escaparHtml(f.alt)}" loading="lazy" referrerpolicy="no-referrer">
    <figcaption>${escaparHtml(f.autor)} · <a href="${escaparHtml(f.licencia_url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.licencia)}</a> · <a href="${escaparHtml(f.fuente)}" target="_blank" rel="noopener noreferrer">${t('fotoOriginal')}</a> · ${t('sinCambios')}</figcaption></figure>`;
}

function pintarFicha(l) {
  const c = tinte(l.region);
  const gm = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.mapas_busqueda || `${l.lat},${l.lng}`)}`;
  const esSendero = ['sendero', 'bici'].includes(l.categoria);
  const tieneTrack = Boolean(TRAZADOS[l.id]);

  /* el sendero y el paseo con guía se nombran uno al otro */
  const guias = LUGARES.filter(o => o.sendero === l.id);
  const sendero = l.sendero ? porId(l.sendero) : null;
  let enlace = '';
  if (guias.length) {
    enlace = `<div class="f-bloque"><p class="f-sub">${t('conGuia')}</p>
      ${guias.map(o => filaChica(o, o.localidad)).join('')}</div>`;
  } else if (sendero) {
    enlace = `<div class="f-bloque"><p class="f-sub">${t('recorre')}</p>
      ${filaChica(sendero, t('dificultad')[sendero.dificultad])}</div>`;
  }
  const cerca = cercanos(l, [...guias.map(o => o.id), ...(sendero ? [sendero.id] : [])]);

  elLista.innerHTML = `
    <button id="volver">${t('volver')}</button>
    ${fotoFicha(l)}
    <div class="f-cuerpo">
      <span class="f-tipo" style="${c}">${svg(CAT[l.categoria].icono, '#241b28')}
        ${tr(CAT[l.categoria].nombre)}</span>
      <div class="f-nombre">${l.nombre}</div>
      <div class="f-donde">${l.localidad} · ${REG[l.region].nombre}${esSendero ? ''
        /* la altura es la de la región: en un sendero confunde, porque
           muchos suben bastante más (el Hornocal está a 4.350 m) */
        : ` · ${tr(REG[l.region].altura)}`}</div>
      ${esSendero ? datosSendero(l) : ''}
      <p class="f-texto">${tr(l.descripcion)}</p>
      ${precioFicha(l)}
      ${datosRelevamiento(l)}
      ${botonesContacto(l)}
      <div class="f-acciones">
        <a class="llegar" href="${gm}" target="_blank" rel="noopener">${t(l.relevamiento?.ubicacion === 'referencia' ? 'buscarMaps' : 'comoLlegar')}</a>
        <button class="boton" id="compartir">${svg('compartir', 'currentColor')}${t('compartir')}</button>
        ${tieneTrack ? `<button class="boton" id="gpx" title="${t('gpxAyuda')}">${svg('bajar', 'currentColor')}${t('gpx')}</button>` : ''}
      </div>
      ${l.muestra ? `<p class="f-muestra">${t('ejemplo')}</p>` : ''}
      ${tieneTrack ? `<p class="f-muestra">${t('avisoSendero')}</p>` : ''}
    </div>
    ${enlace}
    ${cerca.length ? `<div class="f-bloque"><p class="f-sub">${t('cerca')}</p>
      ${cerca.map(x => filaChica(x.o, t('aKm')(cifra(x.km)))).join('')}</div>` : ''}`;

  const imagen = elLista.querySelector('[data-foto]');
  if (imagen) imagen.addEventListener('error', () => {
    imagen.closest('figure').outerHTML = `<div class="f-foto" style="background-image:url('marca/region-${l.region}.jpg')"><span>${t('sinFoto')}</span></div>`;
  }, { once: true });
  document.getElementById('volver').addEventListener('click', cerrarFicha);
  document.getElementById('compartir').addEventListener('click', e => compartir(l, e.currentTarget));
  if (tieneTrack) document.getElementById('gpx').addEventListener('click', () => descargarGpx(l));
  elLista.querySelectorAll('[data-ejemplo]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('nota-ejemplo').hidden = false;
  }));
  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => irA(b.dataset.abre)));
}

function pintarLista(visibles) {
  if (estado.elegido) { pintarFicha(porId(estado.elegido)); return; }

  const sumate = `
    <div class="sumate">
      <img class="forma flor" src="marca/forma-flor.svg" alt="">
      <img class="forma piedra" src="marca/forma-piedra.svg" alt="">
      <p>${t('sumate')}</p>
      <a class="boton" href="mailto:${FUNDACION.email}?subject=${encodeURIComponent(t('sumateAsunto'))}&body=${encodeURIComponent(t('sumateCuerpo'))}">${t('sumateBoton')}</a>
      <p class="de-puna"><img src="logo-puna.png" alt="">${t('proyecto')}</p>
    </div>`;

  if (!visibles.length) {
    elLista.innerHTML = `<p class="vacio">${t('vacio')}</p>` + sumate;
    return;
  }

  /* la altura de la región se muestra acá, ya que salió de los botones */
  const cuenta = visibles.length === 1 ? t('unLugar') : t('nLugares')(visibles.length);
  const cola = estado.zona === 'todas' ? '' : ` · ${tr(REG[estado.zona].altura)}`;

  const portada = estado.zona === 'todas' ? '' : `
    <div class="portada" style="${tinte(estado.zona)}">
      <img src="marca/region-${estado.zona}.jpg" alt="">
      <div><div class="nombre">${REG[estado.zona].nombre}</div>
           <div class="lema">${tr(REG[estado.zona].lema)}</div></div>
    </div>`;

  elLista.innerHTML = portada + `<p class="cuenta">${cuenta}${cola}</p>` +
    visibles.map(l => `
      <button class="item" data-abre="${l.id}">
        <span class="pastilla" style="${tinte(l.region)}">${svg(CAT[l.categoria].icono, '#241b28')}</span>
        <span class="t">
          <span class="n">${l.nombre}</span>
          <span class="d">${l.localidad} · ${TRAZADOS[l.id]
            ? `${cifra(largoKm(l.id))} km · ${t('dificultad')[l.dificultad]}`
            : REG[l.region].nombre}</span>
          <span class="relevado-etiqueta">${t(l.precio?.estado || 'consultar')}</span>
          ${l.relevamiento ? `<span class="relevado-etiqueta">${t('relevado')}${l.relevamiento.ubicacion === 'referencia' ? ` · ${t('orientativo')}` : ''}</span>` : ''}
        </span>
      </button>`).join('') + sumate;

  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => irA(b.dataset.abre)));
}

/* ── Pintar ──────────────────────────────────────────────── */
function pintar() {
  const visibles = LUGARES.filter(pasa);

  capaPins.clearLayers();
  // Varias fichas tienen la misma referencia de localidad: un marcador
  // numerado permite elegir cualquiera sin desplazar artificialmente los pines.
  const grupos = new Map();
  visibles.forEach(l => {
    const clave = `${l.lat},${l.lng}`;
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(l);
  });
  grupos.forEach(grupo => {
    const l = grupo.find(o => o.id === estado.elegido) || grupo[0];
    const m = marcadores[l.id];
    const elegido = l.id === estado.elegido;
    if (grupo.length > 1) {
      const icono = L.divIcon({ className: '', iconSize: [44, 44], iconAnchor: [22, 22],
        html: `<div class="pin grupo orientativo${elegido ? ' elegido' : ''}" style="${tinte(l.region)};width:44px;height:44px">${grupo.length}</div>` });
      const conjunto = L.marker([l.lat, l.lng], { icon: icono, title: `${t('propuestasLocalidad')}: ${grupo.length}` });
      conjunto.bindPopup(`<div class="grupo-propuestas"><strong>${t('propuestasLocalidad')}</strong>
        ${grupo.some(o => o.relevamiento?.ubicacion === 'referencia') ? `<p>${t('ubicacionOrientativa')}</p>` : ''}
        ${grupo.map(o => `<button data-propuesta="${escaparHtml(o.id)}">${escaparHtml(o.nombre)}</button>`).join('')}</div>`);
      conjunto.on('popupopen', () => {
        conjunto.getPopup().getElement().querySelectorAll('[data-propuesta]').forEach(b => b.addEventListener('click', () => {
          map.closePopup();
          irA(b.dataset.propuesta);
        }));
      });
      conjunto.setZIndexOffset(elegido ? 1000 : 0);
      capaPins.addLayer(conjunto);
      return;
    }
    m.setIcon(pin(l, elegido));
    /* El z-index tiene que ir en el contenedor del marcador, que lo
       maneja Leaflet: puesto en el div de adentro no le gana al pin
       vecino y el elegido queda tapado. */
    m.setZIndexOffset(elegido ? 1000 : 0);
    capaPins.addLayer(m);
  });

  /* Los senderos que se ven, y además el que recorre el paseo con guía
     elegido, para que se vea por dónde va. */
  capaSenderos.clearLayers();
  const elegido = estado.elegido && porId(estado.elegido);
  const conTrazado = visibles.filter(l => TRAZADOS[l.id]);
  if (elegido && elegido.sendero && !conTrazado.some(l => l.id === elegido.sendero)) {
    conTrazado.push(porId(elegido.sendero));
  }
  conTrazado.forEach(l =>
    dibujarSendero(l, l.id === estado.elegido || l.id === (elegido && elegido.sendero))
      .addTo(capaSenderos));

  /* El contorno aparece sólo cuando se eligió una región. */
  capaZonas.clearLayers();
  if (estado.zona !== 'todas') {
    poligonos[estado.zona].addTo(capaZonas);
    rotulo(estado.zona).addTo(capaZonas);
  }

  pintarLista(visibles);

  elReg.querySelectorAll('[data-region]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.region === estado.zona)));
  elTipos.querySelectorAll('[data-tipo]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.tipo === estado.tipo)));
  elPrecios.querySelectorAll('[data-precio]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.precio === estado.precio)));
  ORDEN.forEach(k => {
    const on = estado.zona === 'todas' || estado.zona === k;
    elHilos.querySelector(`[data-region="${k}"]`).style.opacity = on ? '1' : '.2';
  });
}

/* ── Búsqueda ────────────────────────────────────────────── */
const elBuscar = document.getElementById('buscar');
elBuscar.addEventListener('input', e => {
  estado.busqueda = e.target.value.trim().toLowerCase();
  soltarElegido();
  pintar();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (cajonAbierto()) { alternarCajon(false); return; }
  if (estado.elegido) cerrarFicha();
});

traducir();
pintar();
revisarBordes();
/* si se entró con un enlace a un lugar (…/#qu-s1), se abre su ficha */
if (porId(decodeURIComponent(location.hash.slice(1)))) seguirDireccion();
</script>
</body>
</html>
