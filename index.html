/* ── Franja de colores ───────────────────────────────────── */
const elHilos = document.getElementById('hilos');
ORDEN.forEach(k => {
  const d = document.createElement('div');
  d.style.background = TINTE[k];
  elHilos.appendChild(d);
});

/* ── Lista y ficha ───────────────────────────────────────── */
const elLista = document.getElementById('lista');

/* Abrir desde un botón pasa por la dirección, así queda un paso en el
   historial: el botón de volver del teléfono cierra la ficha en lugar
   de irse de la página. El cambio de dirección llama a abrir(). */
function irA(id) {
  if (location.hash === '#' + id) abrir(id);
  else location.hash = id;
}
function seguirDireccion() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (porId(id)) abrir(id);
  /* soltarElegido() también saca body.con-ficha: si no, con el botón de
     volver del teléfono la hoja quedaba abierta, con la lista entera. */
  else if (estado.elegido) { soltarElegido(); pintar(); }
}
window.addEventListener('hashchange', seguirDireccion);

function cerrarFicha() { soltarElegido(); pintar(); }

const telefono = matchMedia('(max-width: 900px)');
function abrir(id) {
  const l = porId(id);
  contarLugar('ficha', l);
  /* Si se llega desde «Cerca de acá» o desde un enlace, el lugar puede no
     entrar en los filtros de ahora: se aflojan lo justo para que aparezca. */
  if (!pasa(l) && estado.busqueda) { estado.busqueda = ''; elBuscar.value = ''; }
  if (!pasa(l)) estado.tipo = 'todos';
  if (!pasa(l)) estado.precio = 'todos';
  if (!estado.elegido && !estado.calendario) hojaLista = hoja;
  estado.elegido = id;
  estado.calendario = false;
  plegarArranque();
  ponerHoja('medio');
  document.body.classList.add('con-ficha');
  /* la ficha va en la lista: si estaba escondida, se muestra */
  if (document.body.classList.contains('sin-lista')) {
    document.body.classList.remove('sin-lista');
    pintarBotonLista();
    map.invalidateSize({ animate: false });
  }
  pintar();
  /* En el teléfono la ficha tapa la parte de abajo del mapa: el lugar se
     muestra en la franja que queda libre arriba del panel. */
  let tapado = 0, corrimiento = 0;
  if (telefono.matches) {
    const r = document.getElementById('mapa').getBoundingClientRect();
    const libreArriba = Math.max(r.top, 0);
    /* donde va a quedar el borde de la hoja (todavía está subiendo) */
    const libreAbajo = r.bottom - altoDe('medio');
    tapado = Math.max(0, r.bottom - libreAbajo);
    corrimiento = (r.top + r.height / 2) - (libreArriba + libreAbajo) / 2;
  }
  if (TRAZADOS[id]) {
    map.flyToBounds(L.latLngBounds(TRAZADOS[id].flat()),
      { paddingTopLeft: [40, 40], paddingBottomRight: [40, 40 + tapado], maxZoom: 15, duration: .6 });
  } else {
    /* Se acerca hasta el zoom en que los círculos con número ya se
       separaron (13), así el pin elegido se ve suelto. */
    const z = Math.max(map.getZoom(), 13);
    const centro = map.unproject(map.project([l.lat, l.lng], z).add([0, corrimiento]), z);
    map.flyTo(centro, z, { duration: .6 });
  }
  elLista.scrollTop = 0;
  const v = document.getElementById('volver');
  if (v) v.focus({ preventScroll: true });
}

/* Una fila chica, para el guía, el sendero y lo cercano. */
function filaChica(l, detalle) {
  return `
    <button class="item chico" data-abre="${l.id}">
      <span class="pastilla" style="${tinte(l)}">${svg(CAT[l.categoria].icono, '#241b28')}</span>
      <span class="t">
        <span class="n">${l.nombre}</span>
        <span class="d">${tr(CAT[l.categoria].nombre)} · ${detalle}</span>
      </span>
    </button>`;
}

/* Lo más cercano, de cualquier tipo: un sendero lleva a dónde comer y
   dormir, y un hospedaje a los senderos y paseos de la zona. */
function cercanos(l, apartar) {
  // No calcular distancias a partir de un centro de localidad como si fuera
  // la posición exacta del emprendimiento.
  if (l.relevamiento?.ubicacion === 'referencia') return [];
  return LUGARES
    .filter(o => o.id !== l.id && !apartar.includes(o.id) && o.relevamiento?.ubicacion !== 'referencia')
    .map(o => ({ o, km: distanciaKm([l.lat, l.lng], [o.lat, o.lng]) }))
    .filter(x => x.km <= 30)
    .sort((a, b) => a.km - b.km)
    .slice(0, 4);
}

/* Botones de contacto. En un dato de muestra no llevan a ningún lado:
   avisan que es un ejemplo, para no mandar a nadie a un número inventado. */
function botonesContacto(l) {
  const c = l.contacto;
  if (!c) return '';
  const lista = [];
  if (c.whatsapp) lista.push(['wa', 'chat', t('whatsapp'),
    `https://wa.me/${c.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(t('mensajeWhatsapp')(l.nombre))}`, 'wa']);
  if (c.telefono) lista.push(['', 'telefono', t('llamar'), `tel:${c.telefono.replace(/[^\d+]/g, '')}`, 'tel']);
  if (c.instagram) lista.push(['', 'camara', t('instagram'), `https://www.instagram.com/${c.instagram.replace(/^@/, '')}`, 'ig']);
  if (c.web) lista.push(['', 'globo', t('web'), c.web, 'web']);
  if (c.email) lista.push(['', 'sobre', t('correo'),
    `mailto:${c.email}?subject=${encodeURIComponent(t('asuntoCorreo')(l.nombre))}`, 'mail']);

  if (!lista.length) return '';   // contacto: {} no deja un recuadro vacío
  const botones = lista.map(([clase, icono, texto, href, accion]) => l.muestra
    ? `<button class="boton ${clase}" data-ejemplo>${svg(icono, 'currentColor')}${texto}</button>`
    : `<a class="boton ${clase}" href="${href}" target="_blank" rel="noopener" data-accion="${accion}">${svg(icono, 'currentColor')}${texto}</a>`
  ).join('');
  return `<div class="f-contacto" role="group" aria-label="${t('contacto')}">${botones}</div>
          <p class="f-nota" id="nota-ejemplo" hidden>${t('contactoEjemplo')}</p>`;
}

function datosSendero(l) {
  const d = l.distancia_publicada;
  const distancia = d ? `${cifra(d.km)} km · ${t(d.alcance)}`
    : TRAZADOS[l.id] ? t('largo')(cifra(largoKm(l.id))) : t('datoConsultar');
  return `<div class="f-datos">
    <span class="dato">${svg(l.categoria === 'bici' ? 'bici' : 'bota', '#241b28')}${distancia}</span>
    <span class="dato">${l.dificultad ? t('dificultad')[l.dificultad] : t('datoConsultar')}</span>
    </div>${l.duracion ? `<p class="f-duracion">${svg('reloj', 'currentColor')}${tr(l.duracion)}</p>` : ''}
    ${l.condiciones ? `<p class="f-nota">${escaparHtml(tr(l.condiciones))}</p>` : ''}
    ${!TRAZADOS[l.id] ? `<p class="f-nota">${t('sinTrack')}</p>` : ''}`;
}

async function compartir(l, boton) {
  const url = location.href.split('#')[0] + '#' + l.id;
  if (navigator.share) {
    try { await navigator.share({ title: `${l.nombre} — ${t('titulo')}`, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); } catch (e) { window.prompt('', url); return; }
  const antes = boton.innerHTML;
  boton.innerHTML = svg('compartir', 'currentColor') + t('copiado');
  setTimeout(() => { boton.innerHTML = antes; }, 2200);
}

/* El GPX se arma acá mismo con el trazado: no hay archivos que subir. */
function descargarGpx(l) {
  const esc = s => s.replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
  const tramos = TRAZADOS[l.id].map(tramo => '  <trkseg>\n' +
    tramo.map(([la, lo]) => `    <trkpt lat="${la}" lon="${lo}"/>`).join('\n') + '\n  </trkseg>').join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Ruta Cultural de Jujuy — Fundación Puna" xmlns="http://www.topografix.com/GPX/1/1">
 <metadata>
  <name>${esc(l.nombre)}</name>
  <copyright author="OpenStreetMap contributors"><license>https://opendatacommons.org/licenses/odbl/1-0/</license></copyright>
 </metadata>
 <trk>
  <name>${esc(l.nombre)}</name>
${tramos}
 </trk>
</gpx>
`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = l.nombre.normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.gpx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function escaparHtml(texto) {
  return String(texto).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function datosRelevamiento(l) {
  const r = l.relevamiento;
  if (!r) return '';
  return `<aside class="f-relevamiento" aria-label="${t('relevado')}">
    <strong>${t('relevado')}</strong>
    <p>${t('pendienteVerificacion')}</p>
    ${r.ubicacion === 'referencia' ? `<p>${t('ubicacionOrientativa')}</p>` : ''}
    ${l.direccion ? `<p><b>${t('direccionPublicada')}:</b> ${escaparHtml(l.direccion)}</p>` : ''}
    ${l.categoria === 'artesania' ? `<p>${t('consultaCompra')}</p>` : ''}
    <p>${t('fuente')} · ${t('fechaConsulta')}: ${new Date(r.fecha + 'T12:00:00').toLocaleDateString(estado.idioma)}</p>
    <ul>${r.fuentes.map(f => `<li><a href="${escaparHtml(f.url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.titulo)}</a></li>`).join('')}</ul>
  </aside>`;
}

function precioFicha(l) {
  const p = l.precio;
  return `<aside class="f-relevamiento"><strong>${t('precio')}: ${t(p?.estado || 'consultar')}</strong>
    ${p ? `<p>${escaparHtml(tr(p.nota))}</p><ul>${p.fuentes.map(f => `<li><a href="${escaparHtml(f.url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.titulo)}</a></li>`).join('')}</ul>` : ''}</aside>`;
}
/* Sin foto no va nada: el dibujo de la región con «Todavía sin foto»
   ocupaba media hoja en el teléfono y no decía nada del lugar. */
function fotoFicha(l) {
  const f = l.foto;
  if (!f) return '';
  return `<figure class="foto-libre"><img data-foto src="${escaparHtml(f.url)}" alt="${escaparHtml(f.alt)}" loading="lazy" referrerpolicy="no-referrer">
    <figcaption>${escaparHtml(f.autor)} · <a href="${escaparHtml(f.licencia_url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(f.licencia)}</a> · <a href="${escaparHtml(f.fuente)}" target="_blank" rel="noopener noreferrer">${t('fotoOriginal')}</a> · ${t('sinCambios')}</figcaption></figure>`;
}

function pintarFicha(l) {
  const c = tinte(l);
  const gm = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.mapas_busqueda || `${l.lat},${l.lng}`)}`;
  const esSendero = ['sendero', 'bici'].includes(l.categoria);
  const tieneTrack = Boolean(TRAZADOS[l.id]);

  /* el sendero y el paseo con guía se nombran uno al otro */
  const guias = LUGARES.filter(o => o.sendero === l.id);
  const sendero = l.sendero ? porId(l.sendero) : null;
  let enlace = '';
  if (guias.length) {
    enlace = `<div class="f-bloque"><p class="f-sub">${t('conGuia')}</p>
      ${guias.map(o => filaChica(o, o.localidad)).join('')}</div>`;
  } else if (sendero) {
    enlace = `<div class="f-bloque"><p class="f-sub">${t('recorre')}</p>
      ${filaChica(sendero, t('dificultad')[sendero.dificultad])}</div>`;
  }
  const cerca = cercanos(l, [...guias.map(o => o.id), ...(sendero ? [sendero.id] : [])]);

  /* La foto va después del nombre: en la hoja a media altura del teléfono,
     si iba arriba, no se veía de qué lugar era. */
  elLista.innerHTML = `
    <div class="asa" aria-hidden="true"></div>
    <button id="volver">${t('volver')}</button>
    <div class="f-cuerpo">
      <span class="f-tipo" style="${c}">${svg(CAT[l.categoria].icono, '#241b28')}
        ${tr(CAT[l.categoria].nombre)}</span>
      <div class="f-nombre">${l.nombre}</div>
      <div class="f-donde">${l.localidad} · ${REG[l.region].nombre}${esSendero ? ''
        /* la altura es la de la región: en un sendero confunde, porque
           muchos suben bastante más (el Hornocal está a 4.350 m) */
        : ` · ${tr(REG[l.region].altura)}`}</div>
      ${l.credencial ? `<p class="f-credencial">${svg('guia', 'currentColor')}${t('credencial')}: ${escaparHtml(l.credencial)}</p>` : ''}
      ${fotoFicha(l)}
      ${esSendero ? datosSendero(l) : ''}
      <p class="f-texto">${tr(l.descripcion)}</p>
      ${precioFicha(l)}
      ${datosRelevamiento(l)}
      ${botonesContacto(l)}
      <div class="f-acciones">
        <a class="llegar" href="${gm}" target="_blank" rel="noopener" data-accion="llegar">${t(l.relevamiento?.ubicacion === 'referencia' ? 'buscarMaps' : 'comoLlegar')}</a>
        <button class="boton" id="compartir" data-accion="compartir">${svg('compartir', 'currentColor')}${t('compartir')}</button>
        ${tieneTrack ? `<button class="boton" id="gpx" data-accion="gpx" title="${t('gpxAyuda')}">${svg('bajar', 'currentColor')}${t('gpx')}</button>` : ''}
      </div>
      ${l.muestra ? `<p class="f-muestra">${t('ejemplo')}</p>` : ''}
      ${tieneTrack ? `<p class="f-muestra">${t('avisoSendero')}</p>` : ''}
    </div>
    ${enlace}
    ${cerca.length ? `<div class="f-bloque"><p class="f-sub">${t('cerca')}</p>
      ${cerca.map(x => filaChica(x.o, t('aKm')(cifra(x.km)))).join('')}</div>` : ''}`;

  const imagen = elLista.querySelector('[data-foto]');
  if (imagen) imagen.addEventListener('error', () => imagen.closest('figure').remove(), { once: true });
  document.getElementById('volver').addEventListener('click', cerrarFicha);
  document.getElementById('compartir').addEventListener('click', e => compartir(l, e.currentTarget));
  if (tieneTrack) document.getElementById('gpx').addEventListener('click', () => descargarGpx(l));
  elLista.querySelectorAll('[data-ejemplo]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('nota-ejemplo').hidden = false;
  }));
  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => irA(b.dataset.abre)));
}

/* ¿Hay algún filtro puesto? Entonces, al lado de la cuenta, un botón
   para volver a ver todo de un toque. */
function hayFiltros() {
  return estado.tipo !== 'todos' || estado.precio !== 'todos' || !!estado.busqueda;
}
function activarQuitar() {
  const b = elLista.querySelector('[data-quitar]');
  if (!b) return;
  b.addEventListener('click', () => {
    Object.assign(estado, { tipo: 'todos', precio: 'todos', busqueda: '' });
    dejarCalendario();
    elBuscar.value = '';
    pintar();
  });
}

function pintarLista(visibles) {
  btnFiestas.setAttribute('aria-pressed', String(!!estado.calendario));
  if (estado.elegido) { pintarFicha(porId(estado.elegido)); return; }
  if (estado.calendario) { pintarCalendario(); return; }
  const yo = estado.cerca && [estado.cerca.lat, estado.cerca.lng];

  const sumate = `
    <div class="sumate">
      <img class="forma flor" src="marca/forma-flor.svg" alt="">
      <img class="forma piedra" src="marca/forma-piedra.svg" alt="">
      <p class="pregunta">${t('sumate')}</p>
      <a class="boton" href="mailto:${FUNDACION.email}?subject=${encodeURIComponent(t('sumateAsunto'))}&body=${encodeURIComponent(t('sumateCuerpo'))}">${t('sumateBoton')}</a>
      <p class="de-puna"><img src="logo-puna.png" alt=""><span>${t('proyecto').replace('Fundación Puna', '').trim()} <b>Fundación Puna</b></span></p>
    </div>`;
  /* en la computadora el aviso del relevamiento va acá, al pie */
  const aviso = `<p class="aviso-lista">${t('aviso')} <b>${t('avisoFuerte')}</b> ${t('avisoResto')}</p>`;
  const quitar = hayFiltros() ? `<button class="quitar" data-quitar>${t('quitarFiltros')}</button>` : '';

  if (!visibles.length) {
    elLista.innerHTML = `<div class="asa" aria-hidden="true"></div><p class="vacio">${t('vacio')}</p><p class="cuenta">${quitar}</p>` + aviso + sumate;
    activarQuitar();
    return;
  }

  const cuenta = visibles.length === 1 ? t('unLugar') : t('nLugares')(visibles.length);

  elLista.innerHTML = `<div class="asa" aria-hidden="true"></div><p class="cuenta"><span>${cuenta}</span>${quitar}</p>` +
    visibles.map(l => `
      <button class="item" data-abre="${l.id}">
        <span class="pastilla" style="${tinte(l)}">${svg(CAT[l.categoria].icono, '#241b28')}</span>
        <span class="t">
          <span class="n">${l.nombre}</span>
          ${yo ? `<span class="d distancia">${t('aKm')(cifra(distanciaKm(yo, [l.lat, l.lng])))}</span>` : ''}
          <span class="d">${l.localidad} · ${TRAZADOS[l.id]
            ? `${cifra(largoKm(l.id))} km · ${t('dificultad')[l.dificultad]}`
            : REG[l.region].nombre}</span>
          <span class="relevado-etiqueta">${t(l.precio?.estado || 'consultar')}</span>
          ${l.relevamiento ? `<span class="relevado-etiqueta">${t('relevado')}${l.relevamiento.ubicacion === 'referencia' ? ` · ${t('orientativo')}` : ''}</span>` : ''}
        </span>
      </button>`).join('') + aviso + sumate;

  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => irA(b.dataset.abre)));
  activarQuitar();
}

/* ── Calendario de fiestas ───────────────────────────────── */
const FIESTAS = window.FIESTAS || [];
const mesActual = new Date().getMonth() + 1;
function pintarCalendario() {
  const meses = [];
  for (let i = 0; i < 12; i++) meses.push((mesActual - 1 + i) % 12 + 1);   // desde este mes
  elLista.innerHTML = `<div class="asa" aria-hidden="true"></div>
    <button id="volver">${t('volver')}</button>
    <div class="calendario"><h2 class="f-nombre">${t('calendario')}</h2>
    ${meses.map(m => {
      const del = FIESTAS.filter(x => x.meses[0] === m);
      if (!del.length) return '';
      return `<h3 class="cal-mes${m === mesActual ? ' ahora' : ''}">${t('meses')[m - 1]}</h3>` + del.map(x => `
        <div class="cal-fiesta">
          <div class="n">${escaparHtml(x.nombre)}</div>
          <div class="c">${escaparHtml(tr(x.cuando))}</div>
          <div class="l">${escaparHtml(x.lugar)}${x.region ? ' · ' + REG[x.region].nombre : ''}</div>
          <p>${escaparHtml(tr(x.descripcion))}</p>
          <div class="pie">
            ${x.ficha && porId(x.ficha) ? `<button class="boton" data-abre="${x.ficha}">${t('verEnMapa')}</button>` : ''}
            <span>${t('fuenteFecha')}: <a href="${escaparHtml(x.fuente.url)}" target="_blank" rel="noopener noreferrer">${escaparHtml(x.fuente.titulo)}</a></span>
          </div>
        </div>`).join('');
    }).join('')}</div>`;
  document.getElementById('volver').addEventListener('click', () => {
    estado.calendario = false; document.body.classList.remove('con-ficha'); ponerHoja(hojaLista); pintar();
  });
  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => irA(b.dataset.abre)));
}
function abrirCalendario() {
  if (!estado.elegido && !estado.calendario) hojaLista = hoja;
  estado.calendario = true;
  contar('calendario', {});
  btnFiestas.setAttribute('aria-pressed', 'true');
  plegarArranque();
  ponerHoja('medio');   // en el teléfono sube como la ficha
  document.body.classList.add('con-ficha');
  pintarCalendario();
  elLista.scrollTop = 0;
  document.getElementById('volver').focus({ preventScroll: true });
}

/* ── Pintar ──────────────────────────────────────────────── */
function pintar() {
  const visibles = LUGARES.filter(pasa);
  /* con «Cerca mío», lo más cercano primero */
  if (estado.cerca) {
    const yo = [estado.cerca.lat, estado.cerca.lng];
    visibles.sort((a, b) => distanciaKm(yo, [a.lat, a.lng]) - distanciaKm(yo, [b.lat, b.lng]));
  }

  capaPins.clearLayers();
  // Varias fichas tienen la misma referencia de localidad: un abanico que
  // abre la lista permite elegir cualquiera sin desplazar los pines.
  const grupos = new Map();
  visibles.forEach(l => {
    const clave = `${l.lat},${l.lng}`;
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(l);
  });
  grupos.forEach(grupo => {
    const l = grupo.find(o => o.id === estado.elegido) || grupo[0];
    const m = marcadores[l.id];
    const elegido = l.id === estado.elegido;
    if (grupo.length > 1) {
      const conjunto = L.marker([l.lat, l.lng], { icon: pin(l, elegido, grupo), cuantos: grupo.length,
        categorias: grupo.map(o => o.categoria), title: `${t('propuestasLocalidad')}: ${grupo.length}` });
      conjunto.bindPopup(`<div class="grupo-propuestas"><strong>${t('propuestasLocalidad')}</strong>
        ${grupo.some(o => o.relevamiento?.ubicacion === 'referencia') ? `<p>${t('ubicacionOrientativa')}</p>` : ''}
        ${grupo.map(o => `<button data-propuesta="${escaparHtml(o.id)}">${escaparHtml(o.nombre)}</button>`).join('')}</div>`);
      conjunto.on('popupopen', () => {
        conjunto.getPopup().getElement().querySelectorAll('[data-propuesta]').forEach(b => b.addEventListener('click', () => {
          map.closePopup();
          irA(b.dataset.propuesta);
        }));
      });
      conjunto.setZIndexOffset(elegido ? 1000 : 0);
      capaPins.addLayer(conjunto);
      return;
    }
    m.setIcon(pin(l, elegido));
    /* El z-index tiene que ir en el contenedor del marcador, que lo
       maneja Leaflet: puesto en el div de adentro no le gana al pin
       vecino y el elegido queda tapado. */
    m.setZIndexOffset(elegido ? 1000 : 0);
    capaPins.addLayer(m);
  });

  /* Los senderos que se ven, y además el que recorre el paseo con guía
     elegido, para que se vea por dónde va. */
  capaSenderos.clearLayers();
  const elegido = estado.elegido && porId(estado.elegido);
  const conTrazado = visibles.filter(l => TRAZADOS[l.id]);
  if (elegido && elegido.sendero && !conTrazado.some(l => l.id === elegido.sendero)) {
    conTrazado.push(porId(elegido.sendero));
  }
  conTrazado.forEach(l =>
    dibujarSendero(l, l.id === estado.elegido || l.id === (elegido && elegido.sendero))
      .addTo(capaSenderos));

  pintarLista(visibles);

  elTipos.querySelectorAll('[data-tipo]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.tipo === estado.tipo)));
  btnGratis.setAttribute('aria-pressed', String(estado.precio === 'gratis'));
}

/* ── Búsqueda ────────────────────────────────────────────── */
const elBuscar = document.getElementById('buscar');
/* la búsqueda se cuenta cuando se deja de escribir, no letra por letra */
let esperaBusqueda;
elBuscar.addEventListener('input', e => {
  estado.busqueda = sinTildes(e.target.value.trim());
  dejarCalendario();
  soltarElegido();
  pintar();
  clearTimeout(esperaBusqueda);
  const q = e.target.value.trim();
  if (telefono.matches && q && hoja === 'asomo') ponerHoja('medio');
  if (q.length >= 3) esperaBusqueda = setTimeout(() => contar('busqueda', { q, r: LUGARES.filter(pasa).length }), 1500);
});

/* WhatsApp, llamar, Cómo llegar, compartir…: un solo oyente para toda la ficha */
elLista.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (b && estado.elegido) contarLugar('contacto', porId(estado.elegido), { a: b.dataset.accion });
});
/* ── La hoja de abajo, en el teléfono ────────────────────────
   Como en las aplicaciones de mapas: la hoja asoma con el asa y «129
   lugares»; tocando o arrastrando el asa sube a media pantalla o a casi
   toda. En media altura, bajar leyendo la agranda; arriba de todo,
   deslizar hacia abajo la achica. La ficha y el calendario abren a media
   altura y, arrastrados hasta abajo, se cierran y vuelve la lista. Mover
   el mapa baja la lista para que se vea. */
const enLista = () => !estado.elegido && !estado.calendario;
/* una sonda invisible del alto de --asomo, que depende del teléfono */
const sondaAsomo = document.createElement('div');
sondaAsomo.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;width:0;height:var(--asomo)';
document.body.appendChild(sondaAsomo);
function altoDe(h) {
  if (h === 'asomo') return sondaAsomo.getBoundingClientRect().height;
  const c = document.getElementById('cuerpo').getBoundingClientRect().height;
  return h === 'medio' ? c * .44 : c - 40;
}
function cerrarHoja() {
  if (estado.elegido) cerrarFicha();
  else if (estado.calendario) { dejarCalendario(); pintar(); }
}
/* un toque en el asa: un escalón más arriba; desde arriba de todo, vuelve */
function siguienteHoja() {
  if (hoja === 'asomo') return 'medio';
  if (hoja === 'medio') return 'alta';
  return enLista() ? 'asomo' : 'medio';
}
let arrastre = null;
elLista.addEventListener('pointerdown', e => {
  if (!telefono.matches || !e.target.closest('.asa')) return;
  arrastre = { y: e.clientY, alto: elLista.getBoundingClientRect().height, movio: false };
  elLista.setPointerCapture(e.pointerId);
  document.body.classList.add('arrastrando');
});
elLista.addEventListener('pointermove', e => {
  if (!arrastre) return;
  const dy = arrastre.y - e.clientY;
  if (Math.abs(dy) > 6) arrastre.movio = true;
  const alto = Math.max(60, Math.min(altoDe('alta'), arrastre.alto + dy));
  /* con letra grande la hoja tiene zoom: la medida va en sus unidades */
  elLista.style.height = alto / (document.body.classList.contains('grande') ? 1.25 : 1) + 'px';
});
let soltoEn = 0;
function soltarHoja() {
  if (!arrastre) return;
  const { movio } = arrastre;
  const alto = elLista.getBoundingClientRect().height;
  arrastre = null;
  soltoEn = Date.now();
  document.body.classList.remove('arrastrando');
  elLista.style.height = '';
  if (!movio) { ponerHoja(siguienteHoja()); return; }
  if (!enLista() && alto < altoDe('asomo') * .75) { cerrarHoja(); return; }
  /* queda en la altura más cercana a donde se soltó */
  ponerHoja(['asomo', 'medio', 'alta'].reduce((a, b) =>
    Math.abs(altoDe(b) - alto) < Math.abs(altoDe(a) - alto) ? b : a));
}
elLista.addEventListener('pointerup', soltarHoja);
elLista.addEventListener('pointercancel', soltarHoja);
/* asomada, tocarla fuera de un botón o llegar con el teclado la sube. El
   clic que el navegador manda al soltar el asa no cuenta: si no, al
   bajarla hasta abajo volvía a subir. */
elLista.addEventListener('click', e => {
  if (Date.now() - soltoEn < 400) return;
  if (telefono.matches && hoja === 'asomo' && !e.target.closest('button, a, .asa')) ponerHoja('medio');
});
elLista.addEventListener('focusin', () => {
  if (telefono.matches && hoja === 'asomo') ponerHoja('medio');
});
elLista.addEventListener('scroll', () => {
  if (telefono.matches && hoja === 'medio' && elLista.scrollTop > 12) ponerHoja('alta');
}, { passive: true });
let toque = null;
elLista.addEventListener('touchstart', e => {
  toque = telefono.matches && hoja !== 'asomo' && elLista.scrollTop <= 0 && !e.target.closest('.asa')
    ? e.touches[0].clientY : null;
}, { passive: true });
elLista.addEventListener('touchmove', e => {
  if (toque === null || e.touches[0].clientY - toque < 70) return;
  toque = null;
  ponerHoja(hoja === 'alta' ? 'medio' : 'asomo');
}, { passive: true });
map.on('dragstart', () => {
  if (telefono.matches && enLista() && hoja !== 'asomo') ponerHoja('asomo');
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (cajonAbierto()) { alternarCajon(false); return; }
  if (estado.elegido) cerrarFicha();
  else if (estado.calendario) { dejarCalendario(); pintar(); }
});

/* ── Letra grande ────────────────────────────────────────── */
const btnLetra = document.getElementById('letra');
/* en el teléfono, «A+» va en el mapa debajo del + y el − (acomodarBotones) */
const ControlLetra = L.Control.extend({
  onAdd() {
    const c = L.DomUtil.create('div', 'letra-control');
    L.DomEvent.disableClickPropagation(c);
    return c;
  }
});
const controlLetra = new ControlLetra({ position: 'topleft' }).addTo(map);
function ponerLetra(grande) {
  document.body.classList.toggle('grande', grande);
  btnLetra.setAttribute('aria-pressed', String(grande));
  try { localStorage.setItem('rcj-letra', grande ? '1' : ''); } catch (e) {}
}
btnLetra.addEventListener('click', () => ponerLetra(!document.body.classList.contains('grande')));
try { if (localStorage.getItem('rcj-letra')) ponerLetra(true); } catch (e) {}

/* ── Cerca mío ───────────────────────────────────────────────
   Como las aplicaciones que avisan qué hay cerca: con la página abierta,
   sigue tu posición y avisa una vez por lugar cuando pasás a menos de
   2 km. Con el teléfono bloqueado no puede avisar: eso pediría una
   aplicación instalada. Tu ubicación no sale del teléfono. */
const AVISO_KM = 2;
let seguimiento = null, marcaYo = null;
const avisados = new Set();
const elAviso = document.createElement('div');
elAviso.id = 'aviso-cerca';
elAviso.setAttribute('role', 'status');
elAviso.hidden = true;
document.body.appendChild(elAviso);

function mostrarAviso(texto, idLugar) {
  elAviso.innerHTML = `<span class="texto">${texto}</span>
    ${idLugar ? `<button class="ver">${t('verLugar')}</button>` : ''}
    <button class="x" aria-label="${t('cerrar')}">✕</button>`;
  elAviso.hidden = false;
  if (idLugar) elAviso.querySelector('.ver').addEventListener('click', () => { elAviso.hidden = true; irA(idLugar); });
  elAviso.querySelector('.x').addEventListener('click', () => { elAviso.hidden = true; });
}
const distanciaTexto = km => km < 1 ? `${Math.max(50, Math.round(km * 20) * 50)} m` : `${cifra(km)} km`;

function enPosicion(p) {
  const primera = !estado.cerca;
  estado.cerca = { lat: p.coords.latitude, lng: p.coords.longitude };
  const yo = [estado.cerca.lat, estado.cerca.lng];
  if (!marcaYo) {
    marcaYo = L.marker(yo, { interactive: false, keyboard: false, zIndexOffset: 2000,
      icon: L.divIcon({ className: '', iconSize: [22, 22], html: `<div class="yo" role="img" aria-label="${t('aquiEstas')}"></div>` }) }).addTo(map);
  } else marcaYo.setLatLng(yo);
  if (primera) {
    contar('cerca', { a: 'ok' });
    if (LIMITES.contains(yo)) map.flyTo(yo, 12, { duration: .8 });
    else { mostrarAviso(t('cercaFuera')); map.flyToBounds(LIMITES, { duration: .6 }); }
    pintar();
  }
  /* el lugar más cercano al que todavía no se avisó */
  const cerca = LUGARES.filter(pasa)
    .map(l => ({ l, km: distanciaKm(yo, [l.lat, l.lng]) }))
    .filter(x => x.km <= AVISO_KM && !avisados.has(x.l.id))
    .sort((a, b) => a.km - b.km)[0];
  if (cerca) {
    avisados.add(cerca.l.id);
    mostrarAviso(t('cercaAviso')(cerca.l.nombre, distanciaTexto(cerca.km)), cerca.l.id);
    if (navigator.vibrate) navigator.vibrate(150);
  }
}
function apagarCerca() {
  if (seguimiento !== null) navigator.geolocation.clearWatch(seguimiento);
  seguimiento = null; estado.cerca = null;
  if (marcaYo) { map.removeLayer(marcaYo); marcaYo = null; }
  btnCerca.setAttribute('aria-pressed', 'false');
  pintar();
}
const ControlCerca = L.Control.extend({
  onAdd() {
    const c = L.DomUtil.create('div', 'cerca-control');
    c.innerHTML = `<button id="cerca" aria-pressed="false">${pinMarca('currentColor')}<span></span></button>`;
    L.DomEvent.disableClickPropagation(c);
    return c;
  }
});
new ControlCerca({ position: 'bottomright' }).addTo(map);
const btnCerca = document.getElementById('cerca');
btnCerca.addEventListener('click', () => {
  plegarArranque();
  if (seguimiento !== null) { apagarCerca(); return; }
  if (!navigator.geolocation) { mostrarAviso(t('cercaError')); return; }
  btnCerca.setAttribute('aria-pressed', 'true');
  mostrarAviso(t('cercaBuscando'));
  seguimiento = navigator.geolocation.watchPosition(
    p => { if (elAviso.textContent.includes(t('cercaBuscando'))) elAviso.hidden = true; enPosicion(p); },
    () => { contar('cerca', { a: 'error' }); apagarCerca(); mostrarAviso(t('cercaError')); },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
});

/* En el teléfono «Cerca mío» va con «Buscar lugares» en el medio del mapa
   y «A+» debajo del + y el −; en la computadora, en su rincón y en la
   barra de arriba. Se reacomodan si cambia el ancho (girar el teléfono). */
const rinconCerca = btnCerca.parentElement;
const elDer = document.querySelector('header .der');
function acomodarBotones() {
  if (telefono.matches) {
    elArranque.appendChild(btnCerca);
    controlLetra.getContainer().appendChild(btnLetra);
  } else {
    rinconCerca.appendChild(btnCerca);
    elDer.prepend(btnLetra);
  }
}
acomodarBotones();
telefono.addEventListener('change', acomodarBotones);

function traducirExtras() {
  btnLetra.querySelector('.letra-texto').textContent = t('letraGrande');
  btnLetra.setAttribute('aria-label', t('letraGrande'));
  btnLetra.title = t('letraGrande');
  btnCerca.querySelector('span').textContent = t('cercaMio');
  btnCerca.title = t('cercaAyuda');
}

traducir();
traducirExtras();
pintar();
revisarBordes();
/* si se entró con un enlace a un lugar (…/#qu-s1), se abre su ficha */
if (porId(decodeURIComponent(location.hash.slice(1)))) seguirDireccion();
</script>
</body>
</html>
