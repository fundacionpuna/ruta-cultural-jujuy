<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Cultural de Jujuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   RUTA CULTURAL DE JUJUY
   Versión simple: letra grande, botones grandes, pocas
   decisiones. Todo tiene que poder usarse al sol, en el
   teléfono, sin explicaciones.
   ══════════════════════════════════════════════════════════ */

:root {
  --papel:   #FDFBF6;
  --papel-2: #F4EFE5;
  --tinta:   #23201C;
  --tinta-2: #5D564D;
  --linea:   #DCD4C6;

  /* Tintes andinos, oscurecidos respecto del prototipo sobre
     fondo negro: acá llevan texto blanco encima y tienen que
     dar 4.5:1 incluso en la línea chica de la altura. */
  --puna:     #96681A;
  --quebrada: #B23A26;
  --valles:   #5F7226;
  --yungas:   #1F6E60;
}
.c-puna     { --c: #96681A; }
.c-quebrada { --c: #B23A26; }
.c-valles   { --c: #5F7226; }
.c-yungas   { --c: #1F6E60; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: 'Alegreya Sans', system-ui, sans-serif;
  font-size: 18px;
  background: var(--papel);
  color: var(--tinta);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* el único resto del awayo: una franja tejida, arriba */
#hilos { height: 7px; display: flex; flex-shrink: 0; }
#hilos div { flex: 1; }

/* ── Título ──────────────────────────────────────────────── */
header {
  flex-shrink: 0;
  padding: 13px 24px 0;
  text-align: center;
}
h1 {
  font-family: 'Alegreya', Georgia, serif;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
}
.aviso {
  font-size: 15px;
  color: var(--tinta-2);
  margin: 5px auto 0;
  max-width: 70ch;
  line-height: 1.5;
}
.aviso b { color: var(--tinta); }

/* ── Paso 1: la región ───────────────────────────────────── */
.paso {
  font-size: 15px;
  color: var(--tinta-2);
  margin: 12px 24px 6px;
  text-align: center;
}
#regiones {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
  flex-shrink: 0;
}
.region {
  font-family: 'Alegreya Sans', sans-serif;
  border: 2px solid var(--c);
  background: var(--c);
  color: #fff;
  border-radius: 4px;
  padding: 12px 14px;
  min-height: 56px;
  cursor: pointer;
  text-align: center;
  transition: background .15s, color .15s;
}
/* en bloque, para que la altura nunca se corte a mitad del número */
.region .nom { display: block; font-size: 21px; font-weight: 700; line-height: 1.1; }
.region .alt { display: block; font-size: 14px; opacity: .92; margin-top: 3px; }
.region[aria-pressed="false"] {
  background: #fff;
  color: var(--tinta-2);
  border-color: var(--linea);
}
.region[aria-pressed="false"] .alt { opacity: 1; }
.region:hover { filter: brightness(1.06); }
.region[aria-pressed="false"]:hover { border-color: var(--c); color: var(--c); }

/* ── Paso 2: qué busca ───────────────────────────────────── */
#tipos {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 0 24px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.tipo {
  font-family: 'Alegreya Sans', sans-serif;
  font-size: 17px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--tinta);
  color: #fff;
  border: 2px solid var(--tinta);
  border-radius: 4px;
  padding: 10px 16px;
  min-height: 48px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.tipo svg { width: 21px; height: 21px; flex-shrink: 0; }
.tipo[aria-pressed="false"] {
  background: #fff;
  color: var(--tinta-2);
  border-color: var(--linea);
}
.tipo[aria-pressed="false"]:hover { border-color: var(--tinta-2); color: var(--tinta); }

#barra-buscar {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 11px 24px 12px;
  flex-shrink: 0;
  align-items: center;
  flex-wrap: wrap;
}
#buscar {
  font-family: 'Alegreya Sans', sans-serif;
  font-size: 17px;
  padding: 11px 14px;
  min-height: 48px;
  width: 290px;
  max-width: 100%;
  border: 2px solid var(--linea);
  border-radius: 4px;
  background: #fff;
  color: var(--tinta);
}
#buscar::placeholder { color: #9A9182; }
#buscar:focus { border-color: var(--tinta-2); outline: none; }
#todo {
  font-family: 'Alegreya Sans', sans-serif;
  font-size: 17px;
  background: none;
  border: 2px solid var(--linea);
  border-radius: 4px;
  padding: 11px 18px;
  min-height: 48px;
  color: var(--tinta-2);
  cursor: pointer;
}
#todo:hover { border-color: var(--tinta-2); color: var(--tinta); }

:focus-visible { outline: 3px solid #1F6E60; outline-offset: 2px; }

/* ── Cuerpo: lista + mapa ────────────────────────────────── */
#cuerpo {
  flex: 1;
  display: flex;
  min-height: 0;
  border-top: 1px solid var(--linea);
}
#lista {
  width: 400px;
  flex-shrink: 0;
  overflow-y: auto;
  background: var(--papel);
  border-right: 1px solid var(--linea);
}
#mapa { flex: 1; min-width: 0; }

.cuenta {
  padding: 15px 24px 9px;
  font-size: 16px;
  color: var(--tinta-2);
}

/* ── Fila de la lista ────────────────────────────────────── */
.fila {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  font-family: 'Alegreya Sans', sans-serif;
  background: none;
  border: none;
  border-top: 1px solid var(--linea);
  padding: 15px 24px;
  min-height: 74px;
  cursor: pointer;
}
.fila:hover { background: var(--papel-2); }
.pastilla {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.pastilla svg { width: 21px; height: 21px; }
.fila .t { min-width: 0; }
.fila .n {
  display: block;
  font-family: 'Alegreya', Georgia, serif;
  font-size: 21px;
  font-weight: 500;
  line-height: 1.2;
}
.fila .d {
  display: block;
  font-size: 16px;
  color: var(--tinta-2);
  margin-top: 3px;
}
.vacio {
  padding: 30px 24px;
  font-size: 18px;
  line-height: 1.6;
  color: var(--tinta-2);
}

/* ── Ficha ───────────────────────────────────────────────── */
#volver {
  font-family: 'Alegreya Sans', sans-serif;
  font-size: 17px;
  background: none;
  border: none;
  color: var(--tinta-2);
  cursor: pointer;
  padding: 15px 24px;
  display: flex; align-items: center; gap: 8px;
  min-height: 50px;
}
#volver:hover { color: var(--tinta); }
.f-foto {
  height: 148px;
  background: var(--papel-2);
  border-top: 1px solid var(--linea);
  border-bottom: 1px solid var(--linea);
  display: flex; align-items: center; justify-content: center;
  color: #A69C8C;
  font-size: 16px;
}
.f-cuerpo { padding: 17px 24px 34px; }
.f-tipo {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--c);
  color: #fff;
  border-radius: 3px;
  padding: 5px 11px;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 12px;
}
.f-tipo svg { width: 18px; height: 18px; }
.f-nombre {
  font-family: 'Alegreya', Georgia, serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 5px;
}
.f-donde { font-size: 17px; color: var(--tinta-2); margin-bottom: 16px; }
.f-texto { font-size: 19px; line-height: 1.65; margin-bottom: 18px; }
a.llegar {
  display: inline-block;
  font-size: 18px;
  font-weight: 700;
  background: var(--tinta);
  color: #fff;
  text-decoration: none;
  padding: 14px 24px;
  border-radius: 4px;
  min-height: 52px;
}
a.llegar:hover { background: #000; }
.f-muestra { font-size: 16px; color: var(--tinta-2); margin-top: 14px; }

/* ── Mapa ────────────────────────────────────────────────── */
.leaflet-container { background: var(--papel-2); font-family: 'Alegreya Sans', sans-serif; font-size: 14px; }
#mapa .leaflet-tile-pane { filter: saturate(.62) sepia(.10) brightness(1.02); }
.leaflet-control-zoom a {
  width: 40px !important; height: 40px !important;
  line-height: 38px !important; font-size: 24px !important;
  color: var(--tinta) !important;
}
.leaflet-control-attribution { font-size: 11px !important; }

.pin {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--c);
  border: 3px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.pin svg { width: 18px; height: 18px; }
.pin.elegido {
  width: 46px; height: 46px;
  border-width: 4px;
  box-shadow: 0 0 0 4px rgba(35,32,28,.28), 0 3px 8px rgba(0,0,0,.4);
  z-index: 1000;
}
.pin.elegido svg { width: 24px; height: 24px; }

.rotulo {
  font-family: 'Alegreya Sans', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--c);
  white-space: nowrap;
  transform: translate(-50%, -50%);
  text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px #fff, 0 0 16px #fff;
}

/* ── Teléfono ────────────────────────────────────────────── */
@media (max-width: 900px) {
  header { padding: 13px 15px 0; }
  h1 { font-size: 25px; }
  .aviso { font-size: 14px; }
  .paso { margin: 13px 15px 6px; }
  #regiones {
    grid-template-columns: repeat(2, 1fr);
    padding: 0 15px;
  }
  .region { min-height: 56px; padding: 10px 12px; }
  .region .nom { font-size: 18px; }
  .region .alt { font-size: 13px; }
  #tipos { padding: 0 15px; gap: 8px; }
  .tipo { font-size: 16px; padding: 9px 13px; }
  #barra-buscar { padding: 12px 15px 13px; }
  #buscar { width: 100%; }
  #todo { width: 100%; }

  /* En el teléfono la página entera scrollea como un documento
     normal. Si se intenta meter todo en la pantalla, la lista
     queda con altura cero y no se llega a ella. */
  html, body { height: auto; overflow: visible; }
  #cuerpo { flex-direction: column; min-height: 0; }
  #mapa { order: 1; height: 320px; flex: none; }
  #lista {
    order: 2; width: 100%; flex: none; overflow: visible;
    border-right: none; border-top: 1px solid var(--linea);
  }
  .cuenta, .fila, #volver, .f-cuerpo { padding-left: 15px; padding-right: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="hilos"></div>

<header>
  <h1>Ruta Cultural de Jujuy</h1>
  <p class="aviso">
    Lugares para visitar, dormir, comer y pasear en las cuatro regiones de la provincia.
    <b>Es una muestra:</b> los hospedajes, comidas y paseos son ejemplos inventados.
  </p>
</header>

<p class="paso">1 · Elegí una zona de la provincia</p>
<div id="regiones"></div>

<p class="paso">2 · Elegí qué estás buscando</p>
<div id="tipos"></div>

<div id="barra-buscar">
  <input id="buscar" type="search" placeholder="O buscá un lugar por nombre" aria-label="Buscar un lugar por nombre">
  <button id="todo">Ver todo de nuevo</button>
</div>

<div id="cuerpo">
  <div id="lista" aria-live="polite"></div>
  <div id="mapa"></div>
</div>

<script src="datos.js"></script>
<script>
'use strict';

const REG = window.REGIONES;
const ORDEN = window.ORDEN_REGIONES;
const CAT = window.CATEGORIAS;
const LUGARES = window.LUGARES;

/* colores oscurecidos: sobre papel claro necesitan más peso que
   los del prototipo oscuro, para que el blanco encima se lea */
const TINTE = {
  puna: '#96681A', quebrada: '#B23A26', valles: '#5F7226', yungas: '#1F6E60'
};

const LIMITES = L.latLngBounds([[-24.75, -67.35], [-21.70, -63.85]]);

const estado = {
  regiones: new Set(ORDEN),
  tipos: new Set(Object.keys(CAT)),
  busqueda: '',
  elegido: null
};

/* ── Iconos: dibujos simples, sin leyenda que aprender ───── */
const ICONOS = {
  cama:      '<path d="M3 18v-6h11a4 4 0 0 1 4 4v2M3 18h18M3 12V7M7.5 9.5h3"/>',
  cubiertos: '<path d="M8 3v7a2 2 0 0 1-4 0V3M6 12v9M16 3c1.8 0 2.8 2 2.8 4.6S17.6 12 17.6 12v9"/>',
  cerro:     '<path d="M2 19l6.5-10L13 16l2.5-3.5L22 19z"/>',
  brujula:   '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l2.2 4.5L12 16.5 9.8 12z"/>'
};
function svg(nombre, trazo) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${trazo}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            ${ICONOS[nombre]}</svg>`;
}

/* ── Mapa ────────────────────────────────────────────────── */
/* zoomSnap: 0 — sin esto Leaflet redondea el zoom a un entero y la
   zona elegida entra a la mitad de tamaño, con la mitad del mapa
   vacío. Con zoom fraccionario el contorno llena la pantalla. */
const map = L.map('mapa', {
  zoomControl: true, minZoom: 6, maxZoom: 16, zoomSnap: 0, zoomDelta: 0.6
}).fitBounds(LIMITES);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd'
}).addTo(map);

const capaZonas = L.layerGroup().addTo(map);
const capaPins  = L.layerGroup().addTo(map);

/* Leaflet guarda el tamaño del contenedor y sólo lo recalcula cuando
   cambia el tamaño de la ventana. Acá el mapa se encoge sin que la
   ventana se mueva: al cargar las tipografías la cabecera crece, y en
   el teléfono los botones se acomodan en más filas. Si no le avisamos,
   sigue calculando con la altura vieja y la zona elegida entra chica y
   descentrada. */
let reajuste;
const observador = new ResizeObserver(() => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => map.invalidateSize({ animate: false }), 120);
});
observador.observe(document.getElementById('mapa'));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => map.invalidateSize({ animate: false }));
}

const poligonos = {};
ORDEN.forEach(k => {
  /* Sin relleno: sólo el contorno, y punteado, porque el límite
     es aproximado. Los cuatro rellenos encimados ensuciaban el
     mapa y no aportaban nada. */
  poligonos[k] = L.polygon(REG[k].poligono, {
    color: TINTE[k], weight: 2.5, opacity: .9,
    dashArray: '7 6', fill: false, interactive: false
  });
});

function rotulo(k) {
  const b = poligonos[k].getBounds(), c = b.getCenter();
  return L.marker([c.lat + (b.getNorth() - c.lat) * 0.62, c.lng], {
    interactive: false,
    icon: L.divIcon({ className: '', iconSize: [0, 0],
      html: `<div class="rotulo" style="--c:${TINTE[k]}">${REG[k].nombre}</div>` })
  });
}

const marcadores = {};
LUGARES.forEach(l => {
  const m = L.marker([l.lat, l.lng], { title: l.nombre, alt: l.nombre, icon: pin(l, false) });
  m.on('click', () => abrir(l.id));
  marcadores[l.id] = m;
});
function pin(l, elegido) {
  return L.divIcon({
    className: '', iconSize: elegido ? [46, 46] : [34, 34],
    iconAnchor: elegido ? [23, 23] : [17, 17],
    html: `<div class="pin${elegido ? ' elegido' : ''}" style="--c:${TINTE[l.region]}">
             ${svg(CAT[l.categoria].icono, '#fff')}</div>`
  });
}

/* ── Filtro ──────────────────────────────────────────────── */
function pasa(l) {
  if (!estado.regiones.has(l.region)) return false;
  if (!estado.tipos.has(l.categoria)) return false;
  if (estado.busqueda) {
    const h = `${l.nombre} ${l.localidad} ${l.descripcion}`.toLowerCase();
    if (!h.includes(estado.busqueda)) return false;
  }
  return true;
}
const porId = id => LUGARES.find(l => l.id === id);

/* ── Paso 1: botones de región ───────────────────────────── */
const elReg = document.getElementById('regiones');
ORDEN.forEach(k => {
  const b = document.createElement('button');
  b.className = 'region c-' + k;
  b.dataset.region = k;
  b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<span class="nom">${REG[k].nombre}</span>
                 <span class="alt">${REG[k].altura}</span>`;
  b.addEventListener('click', () => {
    alternar(estado.regiones, k, ORDEN);
    if (estado.elegido && !estado.regiones.has(porId(estado.elegido).region)) estado.elegido = null;
    pintar();
    encuadrar();
  });
  elReg.appendChild(b);
});

/* ── Paso 2: botones de tipo ─────────────────────────────── */
const elTipos = document.getElementById('tipos');
Object.entries(CAT).forEach(([k, c]) => {
  const b = document.createElement('button');
  b.className = 'tipo';
  b.dataset.tipo = k;
  b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `${svg(c.icono, 'currentColor')}<span>${c.boton}</span>`;
  b.addEventListener('click', () => {
    alternar(estado.tipos, k, Object.keys(CAT));
    if (estado.elegido && !estado.tipos.has(porId(estado.elegido).categoria)) estado.elegido = null;
    pintar();
  });
  elTipos.appendChild(b);
});

/* Un clic apaga; si se apagan todos, se vuelven a encender
   todos, así nunca queda el mapa vacío sin explicación. */
function alternar(conjunto, clave, todas) {
  conjunto.has(clave) ? conjunto.delete(clave) : conjunto.add(clave);
  if (!conjunto.size) todas.forEach(t => conjunto.add(t));
}

function encuadrar() {
  const activas = ORDEN.filter(k => estado.regiones.has(k));
  if (activas.length === ORDEN.length) { map.flyToBounds(LIMITES, { duration: .6 }); return; }
  /* Ojo: getBounds() de un polígono devuelve su objeto interno, no una
     copia. Si se le hace extend() encima, se agranda para siempre el
     límite del polígono. Hay que acumular sobre un bounds nuevo. */
  const b = L.latLngBounds([]);
  activas.forEach(k => b.extend(poligonos[k].getBounds()));
  /* poco margen: que la zona elegida llene el mapa */
  map.flyToBounds(b, { padding: [26, 26], duration: .6 });
}

/* ── Franja de hilos ─────────────────────────────────────── */
const elHilos = document.getElementById('hilos');
ORDEN.forEach(k => {
  const d = document.createElement('div');
  d.dataset.region = k;
  d.style.background = TINTE[k];
  elHilos.appendChild(d);
});

/* ── Lista y ficha ───────────────────────────────────────── */
const elLista = document.getElementById('lista');

function abrir(id) {
  estado.elegido = id;
  pintar();
  const l = porId(id);
  map.panTo([l.lat, l.lng], { animate: true, duration: .5 });
  elLista.scrollTop = 0;
  const v = document.getElementById('volver');
  if (v) v.focus({ preventScroll: true });
}

function pintarLista(visibles) {
  if (estado.elegido) {
    const l = porId(estado.elegido), c = TINTE[l.region];
    const gm = `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
    elLista.innerHTML = `
      <button id="volver">← Volver a la lista</button>
      <div class="f-foto">Todavía sin foto</div>
      <div class="f-cuerpo">
        <span class="f-tipo" style="--c:${c}">${svg(CAT[l.categoria].icono, '#fff')}
          ${CAT[l.categoria].nombre}</span>
        <div class="f-nombre">${l.nombre}</div>
        <div class="f-donde">${l.localidad} · ${REG[l.region].nombre}</div>
        <p class="f-texto">${l.descripcion}</p>
        <a class="llegar" href="${gm}" target="_blank" rel="noopener">Cómo llegar →</a>
        ${l.muestra ? '<p class="f-muestra">Este lugar es un ejemplo inventado.</p>' : ''}
      </div>`;
    document.getElementById('volver').addEventListener('click', () => {
      estado.elegido = null; pintar();
    });
    return;
  }

  if (!visibles.length) {
    elLista.innerHTML = `<p class="vacio">No encontramos nada así.
      Probá con otro nombre, o tocá <b>Ver todo de nuevo</b>.</p>`;
    return;
  }

  elLista.innerHTML =
    `<p class="cuenta">${visibles.length === 1 ? '1 lugar' : visibles.length + ' lugares'}</p>` +
    visibles.map(l => `
      <button class="fila" data-abre="${l.id}">
        <span class="pastilla" style="--c:${TINTE[l.region]}">${svg(CAT[l.categoria].icono, '#fff')}</span>
        <span class="t">
          <span class="n">${l.nombre}</span>
          <span class="d">${l.localidad} · ${REG[l.region].nombre}</span>
        </span>
      </button>`).join('');

  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => abrir(b.dataset.abre)));
}

/* ── Pintar ──────────────────────────────────────────────── */
function pintar() {
  const visibles = LUGARES.filter(pasa);

  capaPins.clearLayers();
  visibles.forEach(l => {
    const m = marcadores[l.id];
    m.setIcon(pin(l, l.id === estado.elegido));
    capaPins.addLayer(m);
  });

  /* El contorno aparece sólo cuando se eligió una zona. Con las
     cuatro puestas el mapa va limpio, nada más que los lugares. */
  capaZonas.clearLayers();
  if (estado.regiones.size < ORDEN.length) {
    ORDEN.forEach(k => {
      if (!estado.regiones.has(k)) return;
      poligonos[k].addTo(capaZonas);
      rotulo(k).addTo(capaZonas);
    });
  }

  pintarLista(visibles);

  ORDEN.forEach(k => {
    const on = estado.regiones.has(k);
    elReg.querySelector(`[data-region="${k}"]`).setAttribute('aria-pressed', String(on));
    elHilos.querySelector(`[data-region="${k}"]`).style.opacity = on ? '1' : '.18';
  });
  Object.keys(CAT).forEach(k => {
    elTipos.querySelector(`[data-tipo="${k}"]`)
           .setAttribute('aria-pressed', String(estado.tipos.has(k)));
  });
}

/* ── Controles ───────────────────────────────────────────── */
const elBuscar = document.getElementById('buscar');
elBuscar.addEventListener('input', e => {
  estado.busqueda = e.target.value.trim().toLowerCase();
  estado.elegido = null;
  pintar();
});
document.getElementById('todo').addEventListener('click', () => {
  estado.regiones = new Set(ORDEN);
  estado.tipos = new Set(Object.keys(CAT));
  estado.busqueda = '';
  estado.elegido = null;
  elBuscar.value = '';
  map.flyToBounds(LIMITES, { duration: .6 });
  pintar();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && estado.elegido) { estado.elegido = null; pintar(); }
});

pintar();
</script>
