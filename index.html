<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Cultural de Jujuy — Fundación Puna</title>
<!-- El favicon va en un PNG cuadrado aparte: logo-puna.png es 284x198 y
     el navegador lo estiraba para meterlo en el cuadrado de la pestaña. -->
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   RUTA CULTURAL DE JUJUY — Fundación Puna
   Paleta y tipografía de la marca Puna.
   Títulos en Outfit, cuerpo en Open Sans.
   ══════════════════════════════════════════════════════════ */

:root {
  /* marca Puna */
  --papel:   #ffffff;   /* fondo: blanco, para leer más fácil */
  --crema:   #ffead2;   /* la crema de la marca queda como acento */
  --blanco:  #ffffff;
  --coral:   #ff5a4a;
  --verde:   #7ba551;
  --naranja: #ff914d;
  --azul:    #6492d8;
  --morado:  #79408d;
  --morado-medio: #9e69b1;

  /* neutros de la marca. Con el fondo blanco, el gris malva de la
     marca vuelve a su valor original: sobre blanco da 5.2:1. */
  --tinta:  #2a1f2e;
  --suave:  #78677e;
  --borde:  #d8cede;

  --curva: 999px;   /* todo redondeado: botones tipo píldora */
}
.c-puna     { --c: var(--coral); }
.c-quebrada { --c: var(--naranja); }
.c-valles   { --c: var(--verde); }
.c-yungas   { --c: var(--azul); }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: 'Open Sans', system-ui, sans-serif;
  font-size: 17px;
  background: var(--papel);
  color: var(--tinta);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* franja con los cuatro colores de región */
#hilos { height: 6px; display: flex; flex-shrink: 0; }
#hilos div { flex: 1; transition: opacity .25s; }

/* ── Cabecera ────────────────────────────────────────────── */
header {
  flex-shrink: 0;
  padding: 15px 24px 0;
  text-align: center;
  position: relative;
}
#idiomas {
  position: absolute;
  top: 14px;
  right: 20px;
  display: flex;
  gap: 5px;
}
.idioma {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .03em;
  min-width: 48px;
  min-height: 44px;   /* mismo mínimo que el resto, para el dedo */
  padding: 8px 13px;
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  background: var(--blanco);
  color: var(--suave);
  cursor: pointer;
}
.idioma:hover { border-color: var(--morado-medio); color: var(--tinta); }
.idioma[aria-pressed="true"] {
  background: var(--morado);
  border-color: var(--morado);
  color: var(--blanco);
}

.marca {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
}
.marca img { height: 40px; width: auto; display: block; }
.marca .textos { text-align: left; }
h1 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 31px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.01em;
}
.proyecto {
  font-size: 14px;
  color: var(--suave);
  margin-top: 3px;
}
.aviso {
  font-size: 14px;
  color: var(--suave);
  margin: 9px auto 0;
  max-width: 74ch;
  line-height: 1.55;
}
.aviso b { color: var(--tinta); }

/* ── Pasos ───────────────────────────────────────────────── */
.paso {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--suave);
  margin: 13px 24px 7px;
  text-align: center;
}

/* ── Filas de píldoras ───────────────────────────────────── */
.fila-botones {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  padding: 0 24px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* base común de las dos filas */
.pildora {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--blanco);
  color: var(--suave);
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.pildora:hover { border-color: var(--morado-medio); color: var(--tinta); }
/* elegida: coral de Puna. El texto va en tinta, no en blanco:
   blanco sobre coral da 3.1:1 y no llega al mínimo legible. */
.pildora[aria-pressed="true"] {
  background: var(--coral);
  border-color: var(--coral);
  color: var(--tinta);
}
.pildora[aria-pressed="true"]:hover { filter: brightness(1.04); }

/* fila 1 — regiones */
.region { font-size: 17px; padding: 10px 21px; min-height: 48px; }
.region .punto {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--c); flex-shrink: 0;
  box-shadow: 0 0 0 1.5px rgba(42,31,46,.16);
}
/* Sobre la píldora coral, el punto coral de Puna desaparecería y el
   naranja de la Quebrada casi. Un aro blanco lo despega del fondo. */
.region[aria-pressed="true"] .punto { box-shadow: 0 0 0 2px var(--blanco); }
.region .chakana { width: 19px; height: 19px; flex-shrink: 0; }

/* fila 2 — qué busca. Más chica que la de regiones. */
.tipo { font-size: 15px; padding: 8px 16px; min-height: 44px; }
.tipo svg { width: 19px; height: 19px; flex-shrink: 0; }

/* ── Búsqueda ────────────────────────────────────────────── */
#barra-buscar {
  display: flex;
  justify-content: center;
  padding: 12px 24px 13px;
  flex-shrink: 0;
}
#buscar {
  font-family: 'Open Sans', sans-serif;
  font-size: 16px;
  padding: 11px 20px;
  min-height: 46px;
  width: 320px;
  max-width: 100%;
  border: 2px solid var(--borde);
  border-radius: var(--curva);
  background: var(--blanco);
  color: var(--tinta);
}
#buscar::placeholder { color: #a99bad; }
#buscar:focus { border-color: var(--morado-medio); outline: none; }

:focus-visible { outline: 3px solid var(--morado); outline-offset: 2px; }

/* ── Cuerpo ──────────────────────────────────────────────── */
#cuerpo {
  flex: 1;
  display: flex;
  min-height: 0;
  border-top: 1px solid var(--borde);
}
#lista {
  width: 396px;
  flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid var(--borde);
}
#mapa { flex: 1; min-width: 0; }

.cuenta {
  padding: 15px 24px 10px;
  font-size: 15px;
  color: var(--suave);
}

/* ── Fila de la lista ────────────────────────────────────── */
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  font-family: 'Open Sans', sans-serif;
  background: none;
  border: none;
  border-top: 1px solid var(--borde);
  padding: 14px 24px;
  min-height: 72px;
  cursor: pointer;
}
.item:hover { background: var(--crema); }
.pastilla {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.pastilla svg { width: 21px; height: 21px; }
.item .t { min-width: 0; display: block; }
.item .n {
  display: block;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.22;
  color: var(--tinta);
}
.item .d {
  display: block;
  font-size: 14.5px;
  color: var(--suave);
  margin-top: 2px;
}
.vacio {
  padding: 30px 24px;
  font-size: 17px;
  line-height: 1.6;
  color: var(--suave);
}

/* ── Ficha ───────────────────────────────────────────────── */
#volver {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 500;
  background: none;
  border: none;
  color: var(--suave);
  cursor: pointer;
  padding: 15px 24px;
  min-height: 50px;
}
#volver:hover { color: var(--tinta); }
.f-foto {
  height: 150px;
  background: var(--crema);
  border-top: 1px solid var(--borde);
  border-bottom: 1px solid var(--borde);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 7px;
  color: #b4a8b8;
  font-size: 14.5px;
}
.f-foto svg { width: 34px; height: 34px; opacity: .45; }
.f-cuerpo { padding: 18px 24px 34px; }
.f-tipo {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  background: var(--c);
  color: var(--tinta);
  border-radius: var(--curva);
  padding: 6px 14px;
  font-size: 14px;
  margin-bottom: 12px;
}
.f-tipo svg { width: 17px; height: 17px; }
.f-nombre {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 5px;
}
.f-donde { font-size: 16px; color: var(--suave); margin-bottom: 15px; }
.f-texto { font-size: 17.5px; line-height: 1.68; margin-bottom: 20px; }
a.llegar {
  display: inline-block;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 17px;
  font-weight: 600;
  background: var(--morado);
  color: var(--blanco);
  text-decoration: none;
  padding: 13px 26px;
  border-radius: var(--curva);
  min-height: 50px;
}
a.llegar:hover { background: #8c4ba3; }
.f-muestra { font-size: 15px; color: var(--suave); margin-top: 14px; }

/* ── Mapa ────────────────────────────────────────────────── */
.leaflet-container {
  background: #f2eef4;
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
}
#mapa .leaflet-tile-pane { filter: saturate(.5) sepia(.13) brightness(1.04); }
.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 1px 4px rgba(42,31,46,.2) !important;
  border-radius: 22px !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  width: 40px !important; height: 40px !important;
  line-height: 38px !important; font-size: 23px !important;
  color: var(--tinta) !important;
  background: var(--blanco) !important;
  border-bottom-color: var(--borde) !important;
}
.leaflet-control-attribution { font-size: 10.5px !important; }

.pin {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--c);
  border: 3px solid var(--blanco);
  box-shadow: 0 2px 5px rgba(42,31,46,.3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.pin svg { width: 18px; height: 18px; }
.pin.elegido {
  width: 46px; height: 46px;
  box-shadow: 0 0 0 4px rgba(121,64,141,.3), 0 3px 8px rgba(42,31,46,.35);
}
.pin.elegido svg { width: 24px; height: 24px; }

.rotulo {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--c);
  white-space: nowrap;
  transform: translate(-50%, -50%);
  text-shadow: 0 0 4px var(--papel), 0 0 8px var(--papel),
               0 0 12px var(--papel), 0 0 16px var(--papel);
}

/* ── Teléfono ────────────────────────────────────────────── */
@media (max-width: 900px) {
  html, body { height: auto; overflow: visible; }
  header { padding: 12px 14px 0; }
  #idiomas { position: static; justify-content: center; margin-bottom: 11px; }
  .marca { flex-direction: column; gap: 8px; }
  .marca .textos { text-align: center; }
  .marca img { height: 36px; }
  h1 { font-size: 24px; }
  .proyecto { font-size: 13px; }
  .aviso { font-size: 13.5px; }
  .paso { margin: 12px 14px 6px; }
  .fila-botones { padding: 0 14px; gap: 8px; }
  .region { font-size: 15.5px; padding: 9px 16px; }
  .tipo { font-size: 14px; padding: 7px 13px; }
  #barra-buscar { padding: 11px 14px 12px; }
  #buscar { width: 100%; }

  #cuerpo { flex-direction: column; min-height: 0; }
  #mapa { order: 1; height: 320px; flex: none; }
  #lista {
    order: 2; width: 100%; flex: none; overflow: visible;
    border-right: none; border-top: 1px solid var(--borde);
  }
  .cuenta, .item, #volver, .f-cuerpo { padding-left: 14px; padding-right: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="hilos"></div>

<header>
  <div id="idiomas"></div>
  <div class="marca">
    <img src="logo-puna.png" alt="Fundación Puna">
    <div class="textos">
      <h1 id="titulo">Ruta Cultural de Jujuy</h1>
      <p class="proyecto" id="proyecto">Un proyecto de Fundación Puna</p>
    </div>
  </div>
  <p class="aviso" id="aviso"></p>
</header>

<p class="paso" id="paso1"></p>
<div class="fila-botones" id="regiones"></div>

<p class="paso" id="paso2"></p>
<div class="fila-botones" id="tipos"></div>

<div id="barra-buscar">
  <input id="buscar" type="search">
</div>

<div id="cuerpo">
  <div id="lista" aria-live="polite"></div>
  <div id="mapa"></div>
</div>

<script src="datos.js"></script>
<script>
'use strict';

const REG = window.REGIONES;
const ORDEN = window.ORDEN_REGIONES;
const CAT = window.CATEGORIAS;
const LUGARES = window.LUGARES;
const IDIOMAS = window.IDIOMAS;
const TEXTOS = window.TEXTOS;

/* Idioma: el que eligió antes, o el del navegador si es uno de los
   tres, o castellano. */
function idiomaInicial() {
  const guardado = localStorage.getItem('rcj-idioma');
  if (guardado && IDIOMAS[guardado]) return guardado;
  const nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return IDIOMAS[nav] ? nav : 'es';
}
/* t() para los textos de interfaz; tr() para los campos {es,en,pt}
   de los datos, con el castellano como respaldo si falta alguno. */
const t = clave => TEXTOS[estado.idioma][clave];
const tr = campo => typeof campo === 'string'
  ? campo
  : (campo[estado.idioma] || campo.es);

const TINTE = {};
ORDEN.forEach(k => TINTE[k] = REG[k].color);

const LIMITES = L.latLngBounds([[-24.75, -67.35], [-21.70, -63.85]]);

/* Una región y un tipo a la vez: siempre hay exactamente un botón
   encendido y es el que se está viendo. */
const estado = { idioma: 'es', zona: 'todas', tipo: 'todos', busqueda: '', elegido: null };
estado.idioma = idiomaInicial();

/* ── Dibujos ─────────────────────────────────────────────── */
const ICONOS = {
  cama:      '<path d="M3 18v-6h11a4 4 0 0 1 4 4v2M3 18h18M3 12V7M7.5 9.5h3"/>',
  cubiertos: '<path d="M8 3v7a2 2 0 0 1-4 0V3M6 12v9M16 3c1.8 0 2.8 2 2.8 4.6S17.6 12 17.6 12v9"/>',
  cerro:     '<path d="M2 19l6.5-10L13 16l2.5-3.5L22 19z"/>',
  brujula:   '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l2.2 4.5L12 16.5 9.8 12z"/>'
};
function svg(nombre, trazo) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${trazo}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            ${ICONOS[nombre]}</svg>`;
}
/* La chakana: cruz escalonada andina. Sus cuatro brazos son las cuatro
   partes del mundo andino, así que va en el botón de toda la provincia. */
function chakana(relleno, clase) {
  return `<svg class="${clase || ''}" viewBox="0 0 24 24" fill="${relleno}" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M8 0h8v4h4v4h4v8h-4v4h-4v4H8v-4H4v-4H0V8h4V4h4z M10 10h4v4h-4z"/>
          </svg>`;
}

/* ── Mapa ────────────────────────────────────────────────── */
const map = L.map('mapa', {
  zoomControl: true, minZoom: 6, maxZoom: 16, zoomSnap: 0, zoomDelta: 0.6
}).fitBounds(LIMITES);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd'
}).addTo(map);

const capaZonas = L.layerGroup().addTo(map);
const capaPins  = L.layerGroup().addTo(map);

/* Leaflet guarda el tamaño del contenedor y sólo lo recalcula con el
   resize de la ventana. Acá el mapa se encoge sin que la ventana se
   mueva (al cargar las tipografías la cabecera crece, y en el teléfono
   los botones se acomodan en más filas). */
let reajuste;
new ResizeObserver(() => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => map.invalidateSize({ animate: false }), 120);
}).observe(document.getElementById('mapa'));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => map.invalidateSize({ animate: false }));
}

const poligonos = {};
ORDEN.forEach(k => {
  poligonos[k] = L.polygon(REG[k].poligono, {
    color: TINTE[k], weight: 2.5, opacity: .9,
    dashArray: '7 6', fill: false, interactive: false
  });
});

function rotulo(k) {
  const b = poligonos[k].getBounds(), c = b.getCenter();
  return L.marker([c.lat + (b.getNorth() - c.lat) * 0.62, c.lng], {
    interactive: false,
    icon: L.divIcon({ className: '', iconSize: [0, 0],
      html: `<div class="rotulo" style="--c:${TINTE[k]}">${REG[k].nombre}</div>` })
  });
}

/* El dibujo del pin va en tinta, no en blanco: sobre el naranja y el
   verde de la marca, el blanco no llega al contraste mínimo. */
function pin(l, elegido) {
  return L.divIcon({
    className: '', iconSize: elegido ? [46, 46] : [34, 34],
    iconAnchor: elegido ? [23, 23] : [17, 17],
    html: `<div class="pin${elegido ? ' elegido' : ''}" style="--c:${TINTE[l.region]}">
             ${svg(CAT[l.categoria].icono, '#2a1f2e')}</div>`
  });
}

const marcadores = {};
LUGARES.forEach(l => {
  const m = L.marker([l.lat, l.lng], { title: l.nombre, alt: l.nombre, icon: pin(l, false) });
  m.on('click', () => abrir(l.id));
  marcadores[l.id] = m;
});

/* ── Filtro ──────────────────────────────────────────────── */
function pasa(l) {
  if (estado.zona !== 'todas' && l.region !== estado.zona) return false;
  if (estado.tipo !== 'todos' && l.categoria !== estado.tipo) return false;
  if (estado.busqueda) {
    const h = `${l.nombre} ${l.localidad} ${tr(l.descripcion)}`.toLowerCase();
    if (!h.includes(estado.busqueda)) return false;
  }
  return true;
}
const porId = id => LUGARES.find(l => l.id === id);

/* ── Paso 1: regiones, todas en una línea ────────────────── */
const elReg = document.getElementById('regiones');
[['todas'], ...ORDEN.map(k => [k])].forEach(([k]) => {
  const b = document.createElement('button');
  b.className = 'pildora region' + (k === 'todas' ? '' : ' c-' + k);
  b.dataset.region = k;
  b.innerHTML = (k === 'todas' ? chakana('currentColor', 'chakana')
                               : '<span class="punto"></span>') + '<span class="et"></span>';
  b.addEventListener('click', () => {
    estado.zona = k;
    if (estado.elegido && !pasa(porId(estado.elegido))) estado.elegido = null;
    pintar();
    encuadrar();
  });
  elReg.appendChild(b);
});

/* ── Paso 2: qué busca, en una línea y más chico ──────────── */
const elTipos = document.getElementById('tipos');
[['todos', null], ...Object.entries(CAT).map(([k, c]) => [k, c.icono])]
.forEach(([k, icono]) => {
  const b = document.createElement('button');
  b.className = 'pildora tipo';
  b.dataset.tipo = k;
  b.innerHTML = (icono ? svg(icono, 'currentColor') : '') + '<span class="et"></span>';
  b.addEventListener('click', () => {
    estado.tipo = k;
    if (estado.elegido && !pasa(porId(estado.elegido))) estado.elegido = null;
    pintar();
  });
  elTipos.appendChild(b);
});

/* ── Botones de idioma ───────────────────────────────────── */
const elIdiomas = document.getElementById('idiomas');
Object.entries(IDIOMAS).forEach(([codigo, i]) => {
  const b = document.createElement('button');
  b.className = 'idioma';
  b.dataset.idioma = codigo;
  b.textContent = i.etiqueta;
  b.lang = codigo;
  b.title = i.nombre;
  b.setAttribute('aria-label', i.nombre);
  b.addEventListener('click', () => {
    estado.idioma = codigo;
    localStorage.setItem('rcj-idioma', codigo);
    traducir();
    pintar();
  });
  elIdiomas.appendChild(b);
});

/* Cambia todo el texto fijo de la página al idioma elegido. Lo que
   sale de los datos (lista y ficha) lo rehace pintar(). */
function traducir() {
  document.documentElement.lang = estado.idioma;
  document.title = t('titulo') + ' — Fundación Puna';
  document.getElementById('titulo').textContent = t('titulo');
  document.getElementById('proyecto').textContent = t('proyecto');
  document.getElementById('aviso').innerHTML =
    `${t('aviso')} <b>${t('avisoFuerte')}</b> ${t('avisoResto')}`;
  document.getElementById('paso1').textContent = t('paso1');
  document.getElementById('paso2').textContent = t('paso2');

  const buscar = document.getElementById('buscar');
  buscar.placeholder = t('buscar');
  buscar.setAttribute('aria-label', t('buscarAria'));

  elReg.querySelector('[data-region="todas"] .et').textContent = t('todasRegiones');
  ORDEN.forEach(k =>
    elReg.querySelector(`[data-region="${k}"] .et`).textContent = REG[k].nombre);
  elTipos.querySelector('[data-tipo="todos"] .et').textContent = t('todo');
  Object.keys(CAT).forEach(k =>
    elTipos.querySelector(`[data-tipo="${k}"] .et`).textContent = tr(CAT[k].boton));

  elIdiomas.querySelectorAll('[data-idioma]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.idioma === estado.idioma)));
}

function encuadrar() {
  if (estado.zona === 'todas') { map.flyToBounds(LIMITES, { duration: .6 }); return; }
  /* getBounds() devuelve el objeto interno del polígono: acá se lee
     y nada más, no se le hace extend() encima. */
  map.flyToBounds(poligonos[estado.zona].getBounds(), { padding: [26, 26], duration: .6 });
}

/* ── Franja de colores ───────────────────────────────────── */
const elHilos = document.getElementById('hilos');
ORDEN.forEach(k => {
  const d = document.createElement('div');
  d.dataset.region = k;
  d.style.background = TINTE[k];
  elHilos.appendChild(d);
});

/* ── Lista y ficha ───────────────────────────────────────── */
const elLista = document.getElementById('lista');

function abrir(id) {
  estado.elegido = id;
  pintar();
  const l = porId(id);
  map.panTo([l.lat, l.lng], { animate: true, duration: .5 });
  elLista.scrollTop = 0;
  const v = document.getElementById('volver');
  if (v) v.focus({ preventScroll: true });
}

function pintarLista(visibles) {
  if (estado.elegido) {
    const l = porId(estado.elegido), c = TINTE[l.region];
    const gm = `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
    elLista.innerHTML = `
      <button id="volver">${t('volver')}</button>
      <div class="f-foto">${chakana('#79408d')}<span>${t('sinFoto')}</span></div>
      <div class="f-cuerpo">
        <span class="f-tipo" style="--c:${c}">${svg(CAT[l.categoria].icono, '#2a1f2e')}
          ${tr(CAT[l.categoria].nombre)}</span>
        <div class="f-nombre">${l.nombre}</div>
        <div class="f-donde">${l.localidad} · ${REG[l.region].nombre} · ${tr(REG[l.region].altura)}</div>
        <p class="f-texto">${tr(l.descripcion)}</p>
        <a class="llegar" href="${gm}" target="_blank" rel="noopener">${t('comoLlegar')}</a>
        ${l.muestra ? `<p class="f-muestra">${t('ejemplo')}</p>` : ''}
      </div>`;
    document.getElementById('volver').addEventListener('click', () => {
      estado.elegido = null; pintar();
    });
    return;
  }

  if (!visibles.length) {
    elLista.innerHTML = `<p class="vacio">${t('vacio')}</p>`;
    return;
  }

  /* la altura de la región se muestra acá, ya que salió de los botones */
  const cuenta = visibles.length === 1 ? t('unLugar') : t('nLugares')(visibles.length);
  const cola = estado.zona === 'todas' ? '' : ` · ${tr(REG[estado.zona].altura)}`;

  elLista.innerHTML = `<p class="cuenta">${cuenta}${cola}</p>` +
    visibles.map(l => `
      <button class="item" data-abre="${l.id}">
        <span class="pastilla" style="--c:${TINTE[l.region]}">${svg(CAT[l.categoria].icono, '#2a1f2e')}</span>
        <span class="t">
          <span class="n">${l.nombre}</span>
          <span class="d">${l.localidad} · ${REG[l.region].nombre}</span>
        </span>
      </button>`).join('');

  elLista.querySelectorAll('[data-abre]').forEach(b =>
    b.addEventListener('click', () => abrir(b.dataset.abre)));
}

/* ── Pintar ──────────────────────────────────────────────── */
function pintar() {
  const visibles = LUGARES.filter(pasa);

  capaPins.clearLayers();
  visibles.forEach(l => {
    const m = marcadores[l.id];
    const elegido = l.id === estado.elegido;
    m.setIcon(pin(l, elegido));
    /* El z-index tiene que ir en el contenedor del marcador, que lo
       maneja Leaflet: puesto en el div de adentro no le gana al pin
       vecino y el elegido queda tapado. */
    m.setZIndexOffset(elegido ? 1000 : 0);
    capaPins.addLayer(m);
  });

  /* El contorno aparece sólo cuando se eligió una región. */
  capaZonas.clearLayers();
  if (estado.zona !== 'todas') {
    poligonos[estado.zona].addTo(capaZonas);
    rotulo(estado.zona).addTo(capaZonas);
  }

  pintarLista(visibles);

  elReg.querySelectorAll('[data-region]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.region === estado.zona)));
  elTipos.querySelectorAll('[data-tipo]').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.tipo === estado.tipo)));
  ORDEN.forEach(k => {
    const on = estado.zona === 'todas' || estado.zona === k;
    elHilos.querySelector(`[data-region="${k}"]`).style.opacity = on ? '1' : '.2';
  });
}

/* ── Búsqueda ────────────────────────────────────────────── */
const elBuscar = document.getElementById('buscar');
elBuscar.addEventListener('input', e => {
  estado.busqueda = e.target.value.trim().toLowerCase();
  estado.elegido = null;
  pintar();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && estado.elegido) { estado.elegido = null; pintar(); }
});

traducir();
pintar();
</script>
</body>
</html>
